name: Playwright Tests

on:
    workflow_dispatch:
    push:
        branches: [Main]
    pull_request:
        branches: [Main]
    schedule:
        - cron: "0 8 * * *" # Runs at 8:00 AM UTC daily (UK time during winter)

jobs:
    playwright-test:
        name: 🧪 SIMS Finance Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
        if: ${{ always() }}
        timeout-minutes: 60
        continue-on-error: true
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                project: [chromium]
                shardIndex: [1, 2]
                shardTotal: [2]

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests for shard ${{ matrix.shardIndex }}
              id: run-tests
              run: |
                  set +e
                  npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --workers=1;
                  echo "STATUS_CODE=$?" >> $GITHUB_ENV
                  #Rename the results file to include shard index
                  mv test-results.json test-results-${{ matrix.shardIndex }}.json
                  echo "Current directory:"
                  pwd
                  echo "Files in current directory:"
                  ls -l
            - name: Upload Test Results for Shard ${{ matrix.shardIndex }}
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.shardIndex }}
                  path: test-results-${{ matrix.shardIndex }}.json
                  retention-days: 30
            - name: Save Test Status for Shard ${{ matrix.shardIndex }}
              if: always()
              run: |
                  if [ $STATUS_CODE -ne 0 ]; then
                    echo "Failed" > shard-${{ matrix.shardIndex }}-status.txt
                  else
                    echo "Passed" > shard-${{ matrix.shardIndex }}-status.txt
                  fi
                  echo "Exit status: $?"
              shell: bash
            - name: Upload Shard Status
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: shard-${{ matrix.shardIndex }}-status
                  path: shard-${{ matrix.shardIndex }}-status.txt

            - uses: actions/cache@v3
              if: always()
              with:
                  path: blob-report-${{ matrix.shardIndex }}
                  key: playwright-blob-report-${{ matrix.shardIndex }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: blob-report-${{ matrix.shardIndex }}
                  path: blob-report
                  retention-days: 30

    merge-reports:
        name: Merging executed reports
        needs: [playwright-test]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            #Restore Cached Reports
            - name: Restore Cached Reports
              uses: actions/cache@v3
              with:
                  path: all-blob-reports
                  key: playwright-blob-report
            #Download artifacts
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-blob-reports
                  pattern: blob-report-*
                  merge-multiple: true
            #Add these steps before the merge
            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Download Test Results from Shards
              uses: actions/download-artifact@v4
              with:
                  path: test-results
                  pattern: test-results-*
                  merge-multiple: true

            - name: List Downloaded Results
              run: |
                  echo "Contents of test-results directory:"
                  ls -la test-results/
                  echo "Full path of test results:"
                  find test-results/ -name "*.json"

            #Merge Playwright reports
            - name: Merge Playwright reports
              run: npx playwright merge-reports --reporter html ./all-blob-reports
            #Configure Git User
            - name: Configure Git User
              run: |
                  git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
                  git config --global user.name "pruthvirajqa2dev"
            #Pull from Main branch
            - name: Pull from Main branch
              run: |
                  git fetch origin
                  git checkout Main  #Checkout the existing Main branch
                  git pull --rebase origin Main || echo "No changes to pull"
            - name: Merge Test Results
              run: |
                  # Create a template for the merged file
                  echo '{
                    "config": null,
                    "suites": [],
                    "errors": [],
                    "stats": {
                      "startTime": null,
                      "duration": 0,
                      "expected": 0,
                      "skipped": 0,
                      "unexpected": 0,
                      "flaky": 0
                    }
                  }' > merged-results.json

                  # Check if test result files exist
                  if ls test-results/test-results-*.json 1> /dev/null 2>&1; then
                    # Merge the results using jq
                    jq -s '
                      reduce .[1:][] as $item (.[0];
                        .suites += $item.suites |
                        .errors += $item.errors |
                        .stats.expected += $item.stats.expected |
                        .stats.skipped += $item.stats.skipped |
                        .stats.unexpected += $item.stats.unexpected |
                        .stats.flaky += $item.stats.flaky |
                        .stats.duration += $item.stats.duration |
                        if .stats.startTime == null or ($item.stats.startTime < .stats.startTime) then
                          .stats.startTime = $item.stats.startTime
                        else . end |
                        if .config == null then .config = $item.config else . end
                      )
                    ' merged-results.json test-results/test-results-*.json > test-results.json
                    echo "Successfully merged test results"
                  else
                    echo "No test result files found to merge"
                    cp merged-results.json test-results.json
                  fi

            # Parse Test Results and Set Variables
            - name: Parse Test Results and Set Variables
              run: node ./src/config/parse-json-report.js
            # Use Environment Variables
            - name: Use Environment Variables
              run: |
                  echo "Executed Tests: ${{ env.EXECUTED_TESTS }}"
                  echo "Passed Tests: ${{ env.PASSED_TESTS }}"
                  echo "Failed Tests: ${{ env.FAILED_TESTS }}"
                  echo "Flaky Tests: ${{ env.FLAKY_TESTS }}"
            # Stash untracked files
            - name: Stash untracked files
              run: |
                  git stash push -m "Stashing untracked report files" --include-untracked
            # Display JSON report (formatted)
            - name: Display JSON report (formatted)
              if: always()
              run: |
                  echo "Formatted JSON report:"
                  echo "Current directory:"
                  pwd
                  echo "Files in current directory:"
                  ls -l
                  jq '.' test-results.json
            # Pull from gh-pages branch
            - name: Pull from gh-pages branch
              run: |
                  git fetch origin
                  git checkout gh-pages  # Checkout the existing gh-pages branch
                  git pull --rebase origin gh-pages || echo "No changes to pull"
            - name: Restore stashed untracked files
              run: |
                  git stash pop || echo "No stashed files to restore"
            - name: Download Existing Reports from GitHub Pages
              run: |
                  git clone --depth 1 --branch gh-pages https://github.com/pruthvirajqa2dev/SIMS-Finance--pw-non-cucumber existing-reports/
                  mkdir -p published-reports
                  cp -r existing-reports/* published-reports/
            - name: Add Current Report with Timestamp
              run: |
                  TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
                  mkdir -p published-reports/$TIMESTAMP
                  cp -r playwright-report/* published-reports/$TIMESTAMP
                  echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
            - name: Download Shard Statuses
              uses: actions/download-artifact@v4
              with:
                  path: all-shard-statuses
                  pattern: shard-*-status
                  merge-multiple: true

            - name: Aggregate Shard Statuses
              id: aggregate-shard-status
              run: |
                  FINAL_STATUS="Passed"

                  for report in all-shard-statuses/shard-*-status.txt; do
                    if grep -q "Failed" "$report"; then
                      FINAL_STATUS="Failed"
                      break
                    fi
                  done
                  echo "Final test status: $FINAL_STATUS"
                  echo "{ \"timestamp\": \"$TIMESTAMP\", \"status\": \" $FINAL_STATUS\" }" > "published-reports/$TIMESTAMP/status.json"
                  echo "Test status from previous job: $FINAL_STATUS"
                  echo "TEST_STATUS=$FINAL_STATUS" >> $GITHUB_ENV
              shell: bash
            - name: Update Index Page
              if: always()
              run: |
                  set -e  # Exit on error
                  
                  INDEX_FILE="published-reports/index.html"
                  
                  # Ensure test-history.json exists and is readable
                  if [ ! -f "published-reports/test-history.json" ]; then
                    echo "Warning: test-history.json not found"
                    echo '{"runs":[]}' > published-reports/test-history.json
                  fi

                  # Read historical data and verify it's valid JSON
                  if ! HISTORICAL_DATA=$(jq '.' published-reports/test-history.json 2>/dev/null); then
                    echo "Warning: Invalid JSON in test-history.json"
                    HISTORICAL_DATA='{"runs":[]}'
                  fi

                      LINK="<a href='./$TIMESTAMP/index.html' target='_blank'>View Report</a>"
                      echo "<tr data-date='$DATE_PART' data-executed='$EXECUTED' data-passed='$PASSED' data-failed='$FAILED' data-flaky='$FLAKY'><td>$DATE_PART</td><td>$TIME_PART</td><td>$LINK</td><td class='$CSS_CLASS'>$STATUS</td></tr>" >> $INDEX_FILE
                    fi
                  done

                  # Close the table and add the chart container
                  echo "</tbody></table>

                        <div class='chart-container'>
                          <h2>Test Execution Trends</h2>
                          <div class='chart-controls'>
                            <div class='data-point-count'>Showing <span id='visiblePoints'>0</span> of <span id='totalPoints'>0</span> data points</div>
                          </div>
                          <div class='chart-wrapper'>
                            <canvas id='trendsChart'></canvas>
                          </div>
                          <div class='slider-container'>
                            <input type='range' id='dataSlider' min='5' max='50' value='10'>
                            <label for='dataSlider'>Number of data points to show: <span id='sliderValue'>10</span></label>
                          </div>
                        </div>
                      </main>

                      <script>
                        document.addEventListener('DOMContentLoaded', function() {
                          console.log('DOM Content Loaded');
                          
                          // Initialize the chart
                          function initializeChart() {
                            console.log('Initializing chart');
                            const rows = Array.from(document.querySelectorAll('#reportsTable tbody tr'));
                            console.log('Found rows:', rows.length);
                            
                            if (rows.length === 0) {
                              console.log('No data rows found');
                              return;
                            }

                            const chartData = {
                              labels: [],
                              datasets: [
                                {
                                  label: 'Executed Tests',
                                  data: [],
                                  borderColor: 'rgb(75, 192, 192)',
                                  tension: 0.1
                                },
                                {
                                  label: 'Passed Tests',
                                  data: [],
                                  borderColor: 'rgb(75, 192, 75)',
                                  tension: 0.1
                                },
                                {
                                  label: 'Failed Tests',
                                  data: [],
                                  borderColor: 'rgb(255, 99, 132)',
                                  tension: 0.1
                                },
                                {
                                  label: 'Flaky Tests',
                                  data: [],
                                  borderColor: 'rgb(255, 159, 64)',
                                  tension: 0.1
                                }
                              ]
                            };

                            rows.forEach(row => {
                              const date = row.cells[0].textContent;
                              const time = row.cells[1].textContent;
                              
                              // Debug logging
                              console.log('Processing row:', {
                                date,
                                time,
                                executed: row.dataset.executed,
                                passed: row.dataset.passed,
                                failed: row.dataset.failed,
                                flaky: row.dataset.flaky
                              });

                              chartData.labels.push(\`\${date} \${time}\`);
                              chartData.datasets[0].data.push(parseInt(row.dataset.executed) || 0);
                              chartData.datasets[1].data.push(parseInt(row.dataset.passed) || 0);
                              chartData.datasets[2].data.push(parseInt(row.dataset.failed) || 0);
                              chartData.datasets[3].data.push(parseInt(row.dataset.flaky) || 0);
                            });

                            const ctx = document.getElementById('trendsChart');
                            if (!ctx) {
                              console.error('Canvas element not found');
                              return;
                            }

                            console.log('Creating chart with data:', chartData);

                            new Chart(ctx, {
                              type: 'line',
                              data: chartData,
                              options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                  y: {
                                    beginAtZero: true,
                                    title: {
                                      display: true,
                                      text: 'Number of Tests'
                                    }
                                  },
                                  x: {
                                    title: {
                                      display: true,
                                      text: 'Date and Time'
                                    }
                                  }
                                },
                                plugins: {
                                  legend: {
                                    position: 'bottom'
                                  }
                                }
                              }
                            });
                          }

                          // Initialize the chart when the page loads
                          initializeChart();
                        });
                  # Read historical data for the chart
                  HISTORICAL_DATA=$(cat published-reports/test-history.json)
                  
                  # Modify the script section to filter valid data points
                  echo "<script>
                    const historicalData = ${HISTORICAL_DATA};
                    
                    document.addEventListener('DOMContentLoaded', function() {
                      // Filter out entries where executed count is 0 or undefined
                      const validRuns = historicalData.runs.filter(run => 
                        run.executed && run.executed > 0
                      );

                      const chartData = {
                        labels: validRuns.map(run => {
                          const [date, time] = run.timestamp.split('_');
                          return \`\${date} \${time.replace(/-/g, ':')}\`;
                        }),
                        datasets: [
                          {
                            label: 'Executed Tests',
                            data: validRuns.map(run => run.executed),
                            borderColor: 'rgb(75, 192, 192)',
                            tension: 0.1
                          },
                          {
                            label: 'Passed Tests',
                            data: validRuns.map(run => run.passed),
                            borderColor: 'rgb(75, 192, 75)',
                            tension: 0.1
                          },
                          {
                            label: 'Failed Tests',
                            data: validRuns.map(run => run.failed),
                            borderColor: 'rgb(255, 99, 132)',
                            tension: 0.1
                          },
                          {
                            label: 'Flaky Tests',
                            data: validRuns.map(run => run.flaky),
                            borderColor: 'rgb(255, 159, 64)',
                            tension: 0.1
                          }
                        ]
                      };

            - name: Commit Current Report to GitHub Pages
              run: |
                  git add published-reports/$TIMESTAMP/
                  git commit -m "Update Playwright reports with $TIMESTAMP"
                  git push origin gh-pages
            - name: Upload Combined Reports for Pages
              uses: actions/upload-artifact@v4
              with:
                  name: upload-html-reports
                  path: published-reports/
            - name: Wait for Artifact to be available
              run: sleep 1 # Wait for 1 second to allow artifact processing
            - name: Setup Pages
              uses: actions/configure-pages@v2
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v1
              with:
                  name: upload-html-reports
                  path: published-reports/
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v1
              with:
                  artifact_name: upload-html-reports
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # - name: Notify on Execution
            #   if: always()
            #   uses: dawidd6/action-send-mail@v3
            #   with:
            #       server_address: smtp.gmail.com
            #       server_port: 465
            #       secure: true
            #       username: ${{ secrets.EMAIL_USERNAME }}
            #       password: ${{ secrets.EMAIL_PASSWORD }}
            #       subject: "SIMS Finance- GitHub Action: Playwright Tests ${{ env.TEST_STATUS }}"
            #       body: |
            #           Hi,
            #           Please find the automated SIMS Finance Playwright Tests Execution Status:

            #           🧪 The Playwright tests have ${{ env.TEST_STATUS }}.

            #           🕒 Latest run was on ${{ env.TIMESTAMP }}.

            #           Please refer the link below to view the report.
            #           https://pruthvirajqa2dev.github.io/SIMS-Finance--pw-non-cucumber/

            #           Regards,
            #           SIMS Finance QA Team
            #       to: pruthviraj.pardeshi@parentpay.com
            #       from: ${{ secrets.EMAIL_USERNAME }}
            #       cc: princy.rajkumar@parentpay.com
            - name: Update Historical Test Data
              run: |
                  set -e  # Exit on error
                  
                  # Create historical data file if it doesn't exist
                  mkdir -p published-reports
                  if [ ! -f "published-reports/test-history.json" ]; then
                    echo '{"runs":[]}' > published-reports/test-history.json
                  fi

                  # Get current test counts from the merged results
                  TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
                  
                  if [ -f "test-results.json" ]; then
                    echo "Reading test results from test-results.json"
                    
                    # Extract values with error checking
                    EXECUTED=$(jq -r '.stats.expected // 0' test-results.json)
                    FAILED=$(jq -r '.stats.unexpected // 0' test-results.json)
                    FLAKY=$(jq -r '.stats.flaky // 0' test-results.json)
                    
                    # Ensure values are numbers
                    if [[ ! "$EXECUTED" =~ ^[0-9]+$ ]] || [[ ! "$FAILED" =~ ^[0-9]+$ ]] || [[ ! "$FLAKY" =~ ^[0-9]+$ ]]; then
                      echo "Error: Invalid numeric values in test results"
                      exit 1
                    fi
                    
                    PASSED=$(echo "$EXECUTED - $FAILED - $FLAKY" | bc)

                    # Debug output
                    echo "Test counts for $TIMESTAMP:"
                    echo "Executed: $EXECUTED"
                    echo "Failed: $FAILED"
                    echo "Flaky: $FLAKY"
                    echo "Passed: $PASSED"

                    # Validate counts
                    if [ "$EXECUTED" -ge 0 ] && [ "$PASSED" -ge 0 ] && [ "$FAILED" -ge 0 ] && [ "$FLAKY" -ge 0 ]; then
                      # Add new entry to history
                      NEW_ENTRY=$(jq -n \
                        --arg ts "$TIMESTAMP" \
                        --arg ex "$EXECUTED" \
                        --arg pa "$PASSED" \
                        --arg fa "$FAILED" \
                        --arg fl "$FLAKY" \
                        '{
                          "timestamp": $ts,
                          "executed": $ex|tonumber,
                          "passed": $pa|tonumber,
                          "failed": $fa|tonumber,
                          "flaky": $fl|tonumber
                        }')

                      # Update history file with backup
                      cp published-reports/test-history.json published-reports/test-history.json.bak
                      if jq --argjson entry "$NEW_ENTRY" '.runs += [$entry]' published-reports/test-history.json > temp.json; then
                        mv temp.json published-reports/test-history.json
                        echo "Successfully updated test history"
                      else
                        echo "Error updating test history, restoring backup"
                        mv published-reports/test-history.json.bak published-reports/test-history.json
                        exit 1
                      fi
                    else
                      echo "Error: Invalid test counts detected"
                      exit 1
                    fi
                  else
                    echo "Warning: test-results.json not found"
                  fi

                  # Commit and push the updated history
                  git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
                  git config --global user.name "pruthvirajqa2dev"
                  git add published-reports/test-history.json
                  git commit -m "Update test history data for $TIMESTAMP" || echo "No changes to commit"
                  git push origin gh-pages || echo "No changes to push"

            # Make sure this step comes after updating the history
            - name: Update Index Page
              run: |
                  INDEX_FILE="published-reports/index.html"
                  
                  # Ensure test-history.json exists and is readable
                  if [ ! -f "published-reports/test-history.json" ]; then
                    echo "Warning: test-history.json not found"
                    echo '{"runs":[]}' > published-reports/test-history.json
                  fi

                  # Read historical data and verify it's valid JSON
                  HISTORICAL_DATA=$(cat published-reports/test-history.json)
                  if ! echo "$HISTORICAL_DATA" | jq empty; then
                    echo "Warning: Invalid JSON in test-history.json"
                    HISTORICAL_DATA='{"runs":[]}'
                  fi


