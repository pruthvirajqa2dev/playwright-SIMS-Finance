                  HTMLEOF
                  # Inject the dynamic data into the template using Node.js
                  node -e "
                    const fs = require('fs');
                    const template = fs.readFileSync('/tmp/index_template.html', 'utf8');
                    const history  = fs.readFileSync('/tmp/consolidated_data.json', 'utf8').trim();
                    const rows     = fs.readFileSync('/tmp/rows_data.json', 'utf8').trim();
                    const result   = template
                      .replace('__HISTORY_PLACEHOLDER__', history)
                      .replace('__ROWS_PLACEHOLDER__', rows);
                    fs.writeFileSync('$INDEX_FILE', result);
                  "
            - name: Cleanup old published reports and history (keep 60 days)
              run: |
                  # Remove published-reports older than 60 days
                  find published-reports/ -maxdepth 1 -mindepth 1 -type d | while read dir; do
                    DIRNAME=$(basename "$dir")
                    # Extract date from directory name (format: YYYY-MM-DD_HH-MM-SS)
                    DIRDATE=$(echo $DIRNAME | cut -d'_' -f1)
                    if [[ $DIRDATE =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                      REPORT_DATE=$(date -d "$DIRDATE" +%s)
                      NOW_DATE=$(date +%s)
                      AGE=$(( (NOW_DATE - REPORT_DATE) / 86400 ))
                      if [ $AGE -gt 60 ]; then
                        echo "Deleting old report: $dir (age: $AGE days)"
                        rm -rf "$dir"
                      fi
                    fi
                  done
                  # Remove old runs from consolidated.json (history)
                  if [ -f "test-results-history/consolidated.json" ]; then
                    jq --arg cutoff "$(date -d '60 days ago' +%Y-%m-%d)" '
                      { runs: (.runs | map(select(.timestamp | split("_")[0] >= $cutoff))) }
                    ' test-results-history/consolidated.json > temp.json && mv temp.json test-results-history/consolidated.json
                  fi 
                  git commit -m "Cleanup: Remove reports and history older than 60 days" || echo "No old reports/history to remove"
                  git push origin Main || echo "No changes to push"
                  git push origin gh-pages || echo "No changes to push"
            - name: Commit Current Report to GitHub Pages
              run: |
                  git add published-reports/$TIMESTAMP/
                  git commit -m "Update Playwright reports with $TIMESTAMP"
                  git push origin gh-pages
            - name: Setup Pages
              uses: actions/configure-pages@v2
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  name: github-pages
                  path: published-reports/
            - name: Set FINAL_STATUS from status.json
              run: |
                  STATUS=$(jq -r '.status' published-reports/$TIMESTAMP/status.json)
                  echo "FINAL_STATUS=$STATUS" >> $GITHUB_ENV
            # - name: Wait for 7 minutes before sending email
            #   run: sleep 420
            - name: Notify on Execution
              if: success()
              uses: dawidd6/action-send-mail@v4
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.EMAIL_USERNAME }}
                  password: ${{ secrets.EMAIL_PASSWORD }}
                  subject: "SIMS Finance- GitHub Action: Playwright Tests ${{ env.FINAL_STATUS }}"
                  body: |
                      Hi,
                      Please find the automated SIMS Finance Playwright Tests Execution Status:
                      🧪 The Playwright tests have ${{ env.FINAL_STATUS }}.
                      🕒 Latest run was on ${{ env.TIMESTAMP }}.
                      Please refer the link below to view the report and graphical representation here:
                      https://pruthvirajqa2dev.github.io/playwright-SIMS-Finance/
                      Regards,
                      SIMS Finance QA Team
                  to: pruthviraj.pardeshi@parentpay.com
                  from: ${{ secrets.EMAIL_USERNAME }}
                  cc: princy.rajkumar@parentpay.com
    Deploy-to-GitHub-Pages:
        # Add a dependency to the merge-reports job
        needs: merge-reports

        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write # to deploy to Pages
            id-token: write # to verify the deployment originates from an appropriate source

        # Deploy to the github-pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        # Specify runner + deployment step
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: github-pages