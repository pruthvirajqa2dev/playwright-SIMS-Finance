name: Playwright Tests

on:
    workflow_dispatch:
    push:
        branches: [Main]

env:
    NODE_VERSION: 20

jobs:
    # =========================
    # TEST EXECUTION
    # =========================
    playwright-test:
        runs-on: ubuntu-latest
        continue-on-error: true

        strategy:
            fail-fast: false
            matrix:
                shardIndex: [1, 2]
                shardTotal: [2]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: npm-${{ hashFiles('package-lock.json') }}

            - uses: actions/cache@v3
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - run: npm ci
            - run: npx playwright install --with-deps

            - name: Run Playwright tests
              run: |
                  set +e
                  npx playwright test Postchecks.spec.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --retries=1
                  echo $? > status.txt

            - name: Rename results
              run: |
                  if [ -f test-results.json ]; then
                    mv test-results.json test-results-${{ matrix.shardIndex }}.json
                  fi

            - uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.shardIndex }}
                  path: test-results-${{ matrix.shardIndex }}.json

            - uses: actions/upload-artifact@v4
              with:
                  name: blob-report-${{ matrix.shardIndex }}
                  path: blob-report

    # =========================
    # MERGE + DASHBOARD
    # =========================
    merge-reports:
        needs: playwright-test
        runs-on: ubuntu-latest

        outputs:
            executed: ${{ steps.metrics.outputs.executed }}
            passed: ${{ steps.metrics.outputs.passed }}
            failed: ${{ steps.metrics.outputs.failed }}
            flaky: ${{ steps.metrics.outputs.flaky }}
            status: ${{ steps.status.outputs.status }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - run: npm ci
            - run: sudo apt-get install -y jq

            - uses: actions/download-artifact@v4
              with:
                  path: results
                  pattern: test-results-*
                  merge-multiple: true

            - uses: actions/download-artifact@v4
              with:
                  path: blobs
                  pattern: blob-report-*
                  merge-multiple: true

            - name: Merge Playwright HTML
              run: npx playwright merge-reports --reporter html ./blobs

            # =========================
            # METRICS
            # =========================
            - name: Extract Metrics
              id: metrics
              run: |
                  if ls results/*.json >/dev/null 2>&1; then
                            
                    EXEC=$(jq -s '[.[].stats.expected + .[].stats.unexpected + .[].stats.flaky] | add' results/*.json)
                    PASS=$(jq -s '[.[].stats.expected] | add' results/*.json)
                    FAIL=$(jq -s '[.[].stats.unexpected] | add' results/*.json)
                    FLAKY=$(jq -s '[.[].stats.flaky] | add' results/*.json)
                            
                  else
                    EXEC=0
                    PASS=0
                    FAIL=0
                    FLAKY=0
                  fi
                            
                  # 🔒 Ensure single-line safe values
                  EXEC=$(echo "$EXEC" | tr -d '\n')
                  PASS=$(echo "$PASS" | tr -d '\n')
                  FAIL=$(echo "$FAIL" | tr -d '\n')
                  FLAKY=$(echo "$FLAKY" | tr -d '\n')
                            
                  echo "executed=$EXEC" >> $GITHUB_OUTPUT
                  echo "passed=$PASS" >> $GITHUB_OUTPUT
                  echo "failed=$FAIL" >> $GITHUB_OUTPUT
                  echo "flaky=$FLAKY" >> $GITHUB_OUTPUT

            # =========================
            # FINAL STATUS
            # =========================
            - name: Determine Final Status
              id: status
              run: |
                  if [ "${{ steps.metrics.outputs.failed }}" -gt 0 ]; then
                    echo "status=Failed" >> $GITHUB_OUTPUT
                  else
                    echo "status=Passed" >> $GITHUB_OUTPUT
                  fi

            # =========================
            # TIMESTAMP
            # =========================
            - name: Generate Timestamp
              id: ts
              run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

            # =========================
            # SAVE REPORT
            # =========================
            - name: Save report
              run: |
                  TIMESTAMP=${{ steps.ts.outputs.TIMESTAMP }}
                  mkdir -p published-reports/$TIMESTAMP

                  if [ -d playwright-report ]; then
                    cp -r playwright-report/* published-reports/$TIMESTAMP
                  fi

                  if [ "$(ls -A results/*.json 2>/dev/null)" ]; then
                    jq -s '.' results/*.json > published-reports/$TIMESTAMP/test-results.json
                  fi

            # =========================
            # GENERATE DASHBOARD (FIXED)
            # =========================
            - name: Generate Index
              run: |
                  mkdir -p published-reports

                  CONSOLIDATED=$(cat test-results-history/consolidated.json 2>/dev/null || echo '{"runs":[]}')

                  PASSED=${{ steps.metrics.outputs.passed }}
                  FAILED=${{ steps.metrics.outputs.failed }}
                  FLAKY=${{ steps.metrics.outputs.flaky }}

                  INDEX_FILE="published-reports/index.html"

                    cat > "$INDEX_FILE" <<'EOF'
                    <!DOCTYPE html>
                    <html>
                    <head>
                    <meta charset="UTF-8">
                    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                            
                    <style>
                    body {font-family:'Segoe UI';background:#f3f4f6;color:#333;margin:0;}
                    .header {background:white;padding:15px;border-left:3px solid #1e40af;font-size:20px;font-weight:600;}
                    .cards {display:flex;gap:20px;margin:20px;}
                    .card {background:white;padding:20px;border-radius:8px;border-top:4px solid #1e40af;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
                    .badge-pass {background:#dcfce7;padding:5px 10px;border-radius:12px;}
                    .badge-fail {background:#fee2e2;padding:5px 10px;border-radius:12px;}
                    </style>
                    </head>
                            
                    <body>
                            
                    <div class="header">FMS Test Reporting</div>
                            
                    <div class="cards">
                    <div class="card">Passed: __PASSED__</div>
                    <div class="card">Failed: __FAILED__</div>
                    <div class="card">Flaky: __FLAKY__</div>
                    </div>
                            
                    <script>
                    const data = JSON.parse('__DATA__');
                    let rows = [...data.runs].reverse();
                            
                    new Chart(document.createElement('canvas'),{
                    type:'line',
                    data:{
                      labels:rows.map(r=>r.timestamp),
                      datasets:[
                        {label:'Passed',data:rows.map(r=>r.counts.passed),borderColor:'#16a34a',tension:0.3,pointRadius:2},
                        {label:'Failed',data:rows.map(r=>r.counts.failed),borderColor:'#dc2626',tension:0.3,pointRadius:2}
                      ]
                    }
                    });
                    </script>

                    </body>
                    </html>
                  EOF
                  # Safe JSON (single line)
                  ESCAPED_JSON=$(echo "$CONSOLIDATED" | jq -c .)                                       
                  sed -i "s/__PASSED__/$PASSED/g" "$INDEX_FILE"
                  sed -i "s/__FAILED__/$FAILED/g" "$INDEX_FILE"
                  sed -i "s/__FLAKY__/$FLAKY/g" "$INDEX_FILE"
                  sed -i "s|__DATA__|$ESCAPED_JSON|g" "$INDEX_FILE"

            - name: Commit & Push
              run: |
                  git config user.name github-actions
                  git config user.email actions@github.com
                  git add .
                  git commit -m "update dashboard" || true
                  git push origin HEAD:gh-pages

    # =========================
    # NOTIFY
    # =========================
    notify:
        needs: merge-reports
        runs-on: ubuntu-latest

        steps:
            - name: Notify on Execution
              if: always()
              uses: dawidd6/action-send-mail@v4
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.EMAIL_USERNAME }}
                  password: ${{ secrets.EMAIL_PASSWORD }}
                  subject: "SIMS Finance - Playwright Tests ${{ needs.merge-reports.outputs.status }}"
                  body: |
                      Hi,

                      🧪 The Playwright tests have ${{ needs.merge-reports.outputs.status }}

                      📊 Summary:
                      Executed: ${{ needs.merge-reports.outputs.executed }}
                      Passed: ${{ needs.merge-reports.outputs.passed }}
                      Failed: ${{ needs.merge-reports.outputs.failed }}
                      Flaky: ${{ needs.merge-reports.outputs.flaky }}

                      🕒 Dashboard:
                      https://pruthvirajqa2dev.github.io/playwright-SIMS-Finance/

                      Regards,
                      SIMS Finance QA Team
                  to: pruthviraj.pardeshi@parentpay.com
                  from: ${{ secrets.EMAIL_USERNAME }}
                  cc: princy.rajkumar@parentpay.com
