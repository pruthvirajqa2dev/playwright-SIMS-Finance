name: Playwright Tests

on:
    workflow_dispatch:
    push:
        branches: [Main]
    pull_request:
        branches: [Main]

jobs:
    playwright-test:
        name: 🧪 SIMS Finance Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
        if: ${{ always() }}
        timeout-minutes: 60
        continue-on-error: true
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            pages: write
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest] # Add Windows support
                project: [chromium]
                shardIndex: [1, 2]
                shardTotal: [2]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: |
                  npx playwright install --with-deps
                  if ("${{ matrix.os }}" == "windows-latest" ); then npm install -g windows-build-tools; fi
            - name: Run Playwright tests
              run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --workers=1
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: blob-report-${{ matrix.os }}-${{ matrix.shardIndex }}
                  path: blob-report
                  retention-days: 30

    merge-reports:
        name: Merging executed reports
        runs-on: ubuntu-latest # Keep merging reports on a single OS for simplicity
        needs: [playwright-test]
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-blob-reports
                  pattern: blob-report-*
                  merge-multiple: true
            - name: Merge Playwright reports
              run: npx playwright merge-reports --reporter html ./all-blob-reports
            - name: Upload combined Playwright HTML Report
              uses: actions/upload-artifact@v4
              with:
                  name: html-report
                  path: playwright-report/
            - name: Setup Pages
              uses: actions/configure-pages@v2
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v1
              with:
                  name: html-reports-to-pages
                  path: playwright-report/
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v1
              with:
                  artifact_name: html-reports-to-pages
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
