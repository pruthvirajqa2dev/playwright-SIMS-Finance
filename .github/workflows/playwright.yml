name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  schedule:
    - cron: "0 8 * * *" # Runs at 8:00 AM UTC daily (UK time during winter)

# Node.js 24 opt-in: required from 2026-06-16 when GitHub Forces all
# Node.js 20 actions to Node.js 24. Remove once action authors publish
# Node.js 24 native versions (actions/checkout, setup-node, etc.).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE OVERVIEW  (5 jobs)
#
#   auth-gate  ──►  postchecks (shard1 ‖ shard2, fail-fast)
#              ──►  merge-reports  ──►  ai-intelligence (non-blocking)
#                                  └──►  Deploy-to-GitHub-Pages
#
#   • auth-gate validates login with up to 1 retry (configured in playwright.config.ts).
#     If it fails the pipeline stops here — no wasted 20 min running postchecks.
#   • postchecks runs two shards in parallel with fail-fast: true.
#     If one shard fails the other is cancelled immediately.
#     Network traces are captured per shard and uploaded as artifacts.
#   • merge-reports runs with if: always() so the dashboard is updated even on
#     auth failure, clearly indicating WHICH stage broke.
#     Exposes TIMESTAMP as a job output for downstream correlation.
#   • ai-intelligence runs after merge-reports (continue-on-error: true at job level).
#     Downloads shard traces, runs the AI pipeline, publishes to gh-pages.
#     A failure here NEVER blocks the Pages deploy.
#   • Deploy-to-GitHub-Pages waits for both merge-reports AND ai-intelligence
#     (always()) so the full gh-pages branch (dashboard + AI artifacts) deploys together.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # =========================================================================
  # JOB 1 — Authentication Gate
  # =========================================================================
  auth-gate:
    name: 🔐 Auth Gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Record true workflow start — used later for the wall-clock total
      - name: Record workflow start time
        run: echo "$(date +%s)" > workflow-start.txt
      - name: Upload workflow start time
        uses: actions/upload-artifact@v4
        with:
          name: workflow-start
          path: workflow-start.txt

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      # retries: 1 is configured in the "auth" project in playwright.config.ts
      - name: Run Auth Gate
        run: |
          set +e
          STORAGE_STATE_PATH=/tmp/storageState.json \
          npx playwright test --project=auth --workers=1
          AUTH_EXIT=$?
          echo "AUTH_EXIT_CODE=$AUTH_EXIT" >> $GITHUB_ENV
          exit $AUTH_EXIT

      # Upload storageState so postchecks shards can reuse the session
      - name: Upload storageState
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storage-state
          path: /tmp/storageState.json
          retention-days: 1

      - name: Rename auth blob report to unique filename
        if: always()
        run: |
          if [ -f blob-report/report.zip ]; then
            mv blob-report/report.zip blob-report/report-auth.zip
          fi

      - name: Upload auth blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-auth
          path: blob-report
          retention-days: 30

      - name: Upload auth test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-auth
          path: test-results.json
          retention-days: 30

      # Stage marker consumed by merge-reports for dashboard observability
      - name: Write stage status
        if: always()
        run: |
          if [ "$AUTH_EXIT_CODE" = "0" ]; then
            echo '{"stage":"auth","status":"Passed"}' > stage-status.json
          else
            echo '{"stage":"auth","status":"Failed"}' > stage-status.json
          fi
      - name: Upload stage status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-status-auth
          path: stage-status.json

  # =========================================================================
  # JOB 2 — Postchecks  (only starts when auth-gate succeeds)
  # =========================================================================
  postchecks:
    name: 🧪 Postchecks (shard ${{ matrix.shardIndex }})
    needs: auth-gate
    if: ${{ success() }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    strategy:
      # Cancel the surviving shard the moment one shard fails
      fail-fast: true
      matrix:
        shardIndex: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright tests (shard ${{ matrix.shardIndex }})
        id: run-tests
        env:
          ENABLE_NETWORK_CAPTURE: "true"
        run: |
          set +e
          # TEMP: run only 1 test per shard for a quick workflow smoke-test.
          # Shard 1 → "RSS570 - Crystal Report"  (fast, ~1 min, passed last run)
          # Shard 2 → "Login and Logout"          (fastest test, ~7 s, passed last run)
          if [ "${{ matrix.shardIndex }}" = "1" ]; then
            GREP_PATTERN="RSS570 - Crystal Report @shard1"
          else
            GREP_PATTERN="Login and Logout @shard2"
          fi
          npx playwright test \
            --project=chromium-shard${{ matrix.shardIndex }} \
            --grep "$GREP_PATTERN" \
            --workers=1
          echo "STATUS_CODE=$?" >> $GITHUB_ENV
          mv test-results.json test-results-${{ matrix.shardIndex }}.json
          echo "Current directory:"; pwd
          echo "Files:"; ls -l

      - name: Diagnose trace capture (shard ${{ matrix.shardIndex }})
        if: always()
        run: |
          echo "── Network trace diagnostics ──────────────────────────────"
          if [ -f ai-outputs/traces/network-traces.json ]; then
            TRACE_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('ai-outputs/traces/network-traces.json','utf8')); console.log(Array.isArray(d)?d.length:0)" 2>/dev/null || echo 0)
            echo "✅ network-traces.json: ${TRACE_COUNT} trace(s)"
          else
            echo "⚠️  network-traces.json not found — capture may not have run"
          fi
          echo "worker shard files:"
          ls ai-outputs/traces/worker-*.json 2>/dev/null && \
            wc -l ai-outputs/traces/worker-*.json || echo "  (none found)"
          echo "───────────────────────────────────────────────────────────"

      - name: Upload Test Results for Shard ${{ matrix.shardIndex }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results-${{ matrix.shardIndex }}.json
          retention-days: 30

      - name: Save shard status
        if: always()
        run: |
          if [ "$STATUS_CODE" -ne 0 ]; then
            echo "Failed" > shard-${{ matrix.shardIndex }}-status.txt
          else
            echo "Passed" > shard-${{ matrix.shardIndex }}-status.txt
          fi
        shell: bash

      - name: Upload Shard Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shardIndex }}-status
          path: shard-${{ matrix.shardIndex }}-status.txt

      - name: Rename shard blob report to unique filename
        if: always()
        run: |
          # Playwright 1.50+ names blobs report-{projectName}-{hash}.zip when
          # multiple projects are configured; the old report.zip path is only
          # created for single-project runs (like auth). Find whatever blob
          # zip exists and normalise it to the name merge-reports expects.
          BLOB_ZIP=$(find blob-report -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$BLOB_ZIP" ]; then
            mv "$BLOB_ZIP" blob-report/report-shard-${{ matrix.shardIndex }}.zip
            echo "✅ Renamed $(basename $BLOB_ZIP) → report-shard-${{ matrix.shardIndex }}.zip"
          else
            echo "⚠️  No blob zip found in blob-report/ for shard ${{ matrix.shardIndex }}"
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 30

      - name: Write stage status
        if: always()
        run: |
          if [ "$STATUS_CODE" -ne 0 ]; then
            echo "{\"stage\":\"postchecks\",\"shard\":${{ matrix.shardIndex }},\"status\":\"Failed\"}" > stage-status.json
          else
            echo "{\"stage\":\"postchecks\",\"shard\":${{ matrix.shardIndex }},\"status\":\"Passed\"}" > stage-status.json
          fi
      - name: Upload stage status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-status-shard-${{ matrix.shardIndex }}
          path: stage-status.json

      - name: Upload network traces (shard ${{ matrix.shardIndex }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-traces-shard-${{ matrix.shardIndex }}
          path: ai-outputs/traces/network-traces.json
          if-no-files-found: warn
          retention-days: 1
        continue-on-error: true

  # =========================================================================
  # JOB 3 — Merge reports & publish dashboard
  # Runs with if: always() so the dashboard reflects even an auth failure.
  # =========================================================================
  merge-reports:
    name: 📊 Merge Reports & Publish Dashboard
    needs: [auth-gate, postchecks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      # Passed to ai-intelligence so AI history entries correlate 1:1 with run dirs
      timestamp: ${{ steps.add-report.outputs.timestamp }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download blob reports (all stages)
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: false

      - name: Download workflow start time
        uses: actions/download-artifact@v4
        with:
          name: workflow-start
          path: all-start-times
        continue-on-error: true

      - name: Resolve workflow start epoch
        run: |
          MIN_START=$(cat all-start-times/workflow-start.txt 2>/dev/null | head -1)
          if [ -z "$MIN_START" ]; then MIN_START=$(date +%s); fi
          echo "WORKFLOW_START_EPOCH=$MIN_START" >> $GITHUB_ENV

      - name: Download stage statuses
        uses: actions/download-artifact@v4
        with:
          path: all-stage-statuses
          pattern: stage-status-*
          merge-multiple: true
        continue-on-error: true

      - name: Determine which stage failed
        run: |
          FAILED_STAGE="None"
          echo "── Stage status files found ─────────────────────────────────────────────────────────"
          # Use 'find' with recursive search — the glob all-stage-statuses/*.json only
          # matches files directly in the root of that directory. When download-artifact
          # places files in subdirectories (which can happen with certain action versions),
          # the glob silently matches nothing and FAILED_STAGE stays "None" even when a
          # shard actually failed.  'find' is depth-agnostic and catches all layouts.
          ALL_STATUS_FILES=$(find all-stage-statuses -name "*.json" 2>/dev/null | sort)
          if [ -z "$ALL_STATUS_FILES" ]; then
            echo "::warning::No stage-status JSON files found in all-stage-statuses — cannot determine failed stage"
          else
            echo "$ALL_STATUS_FILES" | while read f; do
              STATUS=$(jq -r '.status' "$f" 2>/dev/null || echo "unknown")
              STAGE=$(jq  -r '.stage'  "$f" 2>/dev/null || echo "unknown")
              SHARD=$(jq  -r '.shard // "n/a"' "$f" 2>/dev/null)
              echo "  $f  →  stage=$STAGE  shard=$SHARD  status=$STATUS"
            done
          fi
          # Find first failure (auth failure takes priority because postchecks can't run without it)
          for f in $(echo "$ALL_STATUS_FILES"); do
            [ -f "$f" ] || continue
            STATUS=$(jq -r '.status' "$f" 2>/dev/null)
            STAGE=$(jq  -r '.stage'  "$f" 2>/dev/null)
            if [ "$STATUS" = "Failed" ] && [ "$STAGE" = "auth" ]; then
              FAILED_STAGE="auth"
              break
            fi
          done
          # If auth passed, check postchecks
          if [ "$FAILED_STAGE" = "None" ]; then
            for f in $(echo "$ALL_STATUS_FILES"); do
              [ -f "$f" ] || continue
              STATUS=$(jq -r '.status' "$f" 2>/dev/null)
              STAGE=$(jq  -r '.stage'  "$f" 2>/dev/null)
              if [ "$STATUS" = "Failed" ]; then
                FAILED_STAGE="$STAGE"
                break
              fi
            done
          fi
          echo "───────────────────────────────────────────────────────────────────────────────────────"
          echo "Resolved FAILED_STAGE: $FAILED_STAGE"
          echo "FAILED_STAGE=$FAILED_STAGE" >> $GITHUB_ENV

      - name: Load TEST_ENV from .env file
        run: |
          if [ -f src/config/.env ]; then
            TEST_ENV=$(grep '^TEST_ENV=' src/config/.env | cut -d'=' -f2 | tr -d '"' | xargs)
          fi
          if [ -z "$TEST_ENV" ]; then
            echo "Warning: TEST_ENV not found, defaulting to Unknown"
            TEST_ENV="Unknown"
          fi
          echo "TEST_ENV=$TEST_ENV" >> $GITHUB_ENV
          echo "Resolved TEST_ENV: $TEST_ENV"

      - name: Download postcheck test results
        uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: test-results-[12]
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded results
        run: |
          echo "test-results/:"; ls -la test-results/ 2>/dev/null || echo "(empty)"

      - name: Flatten blob reports into merge directory
        run: |
          mkdir -p all-merge-blobs
          find all-blob-reports -name "*.zip" | sort | while read f; do
            BASENAME=$(basename "$f")
            DEST="all-merge-blobs/$BASENAME"
            if [ -f "$DEST" ]; then
              echo "⚠️  COLLISION: $BASENAME already exists — skipping $f"
            else
              cp "$f" "$DEST"
              echo "✅ $BASENAME"
            fi
          done
          echo "Blobs to merge: $(find all-merge-blobs -name '*.zip' | wc -l)"

      - name: Merge Playwright HTML reports
        run: |
          # Use a minimal standalone config so playwright.config.ts is NOT loaded.
          # playwright.config.ts specifies reporter:[blob,json] which silently
          # overrides --reporter html in Playwright 1.50+, preventing playwright-report/
          # from ever being written. This config also avoids the URL env-var throw.
          cat > /tmp/playwright.merge.config.js << 'EOF'
          module.exports = { reporter: [['html', { open: 'never' }]] };
          EOF

          echo "── Blob zip contents ────────────────────────────────────────────"
          for f in all-merge-blobs/*.zip; do
            echo "=== $f ==="
            unzip -l "$f" 2>&1 | head -20 || echo "  (cannot list — invalid zip)"
          done
          echo "─────────────────────────────────────────────────────────────────"

          set +e
          npx playwright merge-reports --config /tmp/playwright.merge.config.js ./all-merge-blobs
          MERGE_EXIT=$?
          set -e

          echo "merge-reports exit code: $MERGE_EXIT"
          echo "── Post-merge playwright-report/ contents ───────────────────────"
          find playwright-report -type f 2>/dev/null || echo "  playwright-report/ not present at CWD"
          echo "─────────────────────────────────────────────────────────────────"

          if [ $MERGE_EXIT -ne 0 ]; then
            echo "::error::merge-reports failed with exit code $MERGE_EXIT"
            exit $MERGE_EXIT
          fi

      - name: Preserve playwright-report to /tmp
        if: always()
        run: |
          if [ -d playwright-report ] && [ -f playwright-report/index.html ]; then
            cp -r playwright-report /tmp/playwright-report-backup
            echo "✅ playwright-report preserved to /tmp ($(find playwright-report -type f | wc -l) files)"
          else
            echo "⚠️  playwright-report/index.html not found after merge"
            echo "    playwright-report/ exists: $([ -d playwright-report ] && echo yes || echo no)"
            mkdir -p /tmp/playwright-report-backup
          fi

      - name: Configure Git User
        run: |
          git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
          git config --global user.name "pruthvirajqa2dev"

      - name: Pull from Main branch
        run: |
          git fetch origin
          git checkout Main
          git pull --rebase origin Main || echo "No changes to pull"

      - name: Merge postcheck test result JSONs
        run: |
          echo '{
            "config": null,
            "suites": [],
            "errors": [],
            "stats": {
              "startTime": null,
              "duration": 0,
              "expected": 0,
              "skipped": 0,
              "unexpected": 0,
              "flaky": 0
            }
          }' > merged-results.json

          SHARD_FILES=$(find test-results/ -name "test-results-*.json" 2>/dev/null | sort)
          if [ -n "$SHARD_FILES" ]; then
            jq -s '
              reduce .[1:][] as $item (.[0];
                .suites += $item.suites |
                .errors += $item.errors |
                .stats.expected   += $item.stats.expected   |
                .stats.skipped    += $item.stats.skipped    |
                .stats.unexpected += $item.stats.unexpected |
                .stats.flaky      += $item.stats.flaky      |
                .stats.duration   += $item.stats.duration   |
                if .stats.startTime == null or ($item.stats.startTime < .stats.startTime) then
                  .stats.startTime = $item.stats.startTime
                else . end |
                if .config == null then .config = $item.config else . end
              )
            ' merged-results.json $SHARD_FILES > test-results.json
            echo "✅ Merged shard results"
          else
            echo "⚠️  No shard results — auth gate likely failed."
            cp merged-results.json test-results.json
          fi

      - name: Parse Test Results and Set Variables
        run: node ./src/config/parse-json-report.js

      - name: Use Environment Variables
        run: |
          echo "Executed Tests: ${{ env.EXECUTED_TESTS }}"
          echo "Passed Tests:   ${{ env.PASSED_TESTS }}"
          echo "Failed Tests:   ${{ env.FAILED_TESTS }}"
          echo "Flaky Tests:    ${{ env.FLAKY_TESTS }}"
          echo "Failed Stage:   $FAILED_STAGE"

      - name: Display JSON report (formatted)
        if: always()
        run: |
          echo "Current directory:"; pwd
          echo "Files:"; ls -l
          if [ -f test-results.json ]; then
            jq '.' test-results.json
          else
            echo "⚠️  test-results.json not found (already stashed or not produced)"
          fi

      - name: Stash untracked files
        run: git stash push -m "Stashing untracked report files" --include-untracked

      - name: Pull from gh-pages branch
        run: |
          git fetch origin
          git checkout gh-pages
          git pull --rebase origin gh-pages || echo "No changes to pull"

      - name: Restore playwright-report from /tmp
        run: |
          rm -rf playwright-report
          cp -r /tmp/playwright-report-backup playwright-report
          echo "✅ playwright-report restored from /tmp ($(find playwright-report -type f | wc -l) files)"

      - name: Generate Human-Readable Execution Time
        run: |
          format_duration () {
            local total_seconds=$1
            local hours=$((total_seconds / 3600))
            local minutes=$(((total_seconds % 3600) / 60))
            local seconds=$((total_seconds % 60))
            local output=""
            if [ $hours -gt 0 ]; then
              output+="${hours} hr"; [ $hours -gt 1 ] && output+="s"
            fi
            if [ $minutes -gt 0 ]; then
              [ -n "$output" ] && output+=" "
              output+="${minutes} min"; [ $minutes -gt 1 ] && output+="s"
            fi
            if [ $seconds -gt 0 ] || [ -z "$output" ]; then
              [ -n "$output" ] && output+=" "
              output+="${seconds} sec"; [ $seconds -gt 1 ] && output+="s"
            fi
            echo "$output"
          }

          if ls test-results/test-results-*.json >/dev/null 2>&1; then
            MAX_DURATION_MS=$(jq -s '[.[].stats.duration] | max | floor' test-results/test-results-*.json)
            if [ "$MAX_DURATION_MS" != "null" ] && [ "$MAX_DURATION_MS" != "0" ] && [ "$MAX_DURATION_MS" -gt 0 ] 2>/dev/null; then
              TOTAL_SEC=$((MAX_DURATION_MS / 1000))
              echo "$(format_duration $TOTAL_SEC)" > execution-time.txt
            else
              echo "N/A" > execution-time.txt
            fi
            SHARD_JSON="["; FIRST=true
            for f in $(ls test-results/test-results-*.json | sort); do
              SHARD_IDX=$(basename "$f" | grep -o '[0-9]*' | tail -1)
              SHARD_MS=$(jq '.stats.duration | floor' "$f")
              if [ "$SHARD_MS" != "null" ] && [ "$SHARD_MS" -gt 0 ] 2>/dev/null; then
                SHARD_SEC=$((SHARD_MS / 1000))
                SHARD_LABEL=$(format_duration $SHARD_SEC)
              else
                SHARD_LABEL="N/A"
              fi
              [ "$FIRST" = true ] && FIRST=false || SHARD_JSON+=","
              SHARD_JSON+="{\"shard\":$SHARD_IDX,\"label\":\"$SHARD_LABEL\"}"
            done
            SHARD_JSON+="]"
            echo "$SHARD_JSON" > shard-times.json
          else
            echo "N/A" > execution-time.txt
            echo "[]"  > shard-times.json
          fi

      - name: Generate workflow total time
        run: |
          format_duration () {
            local total_seconds=$1
            local hours=$((total_seconds / 3600))
            local minutes=$(((total_seconds % 3600) / 60))
            local seconds=$((total_seconds % 60))
            local output=""
            if [ $hours -gt 0 ]; then output+="${hours} hr"; [ $hours -gt 1 ] && output+="s"; fi
            if [ $minutes -gt 0 ]; then [ -n "$output" ] && output+=" "; output+="${minutes} min"; [ $minutes -gt 1 ] && output+="s"; fi
            if [ $seconds -gt 0 ] || [ -z "$output" ]; then [ -n "$output" ] && output+=" "; output+="${seconds} sec"; [ $seconds -gt 1 ] && output+="s"; fi
            echo "$output"
          }
          NOW=$(date +%s)
          ELAPSED=$((NOW - WORKFLOW_START_EPOCH))
          echo "$(format_duration $ELAPSED)" > workflow-time.txt
          echo "Workflow elapsed: $(cat workflow-time.txt)"

      - name: Debug time files
        run: |
          echo "execution-time.txt: $(cat execution-time.txt 2>/dev/null || echo NOT FOUND)"
          echo "workflow-time.txt:  $(cat workflow-time.txt  2>/dev/null || echo NOT FOUND)"

      - name: Add Current Report with Timestamp
        id: add-report
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          mkdir -p published-reports/$TIMESTAMP
          if [ -f playwright-report/index.html ]; then
            cp -r playwright-report/* published-reports/$TIMESTAMP
          else
            echo "⚠️  No playwright-report/index.html — auth-gate failed before producing blob data"
            printf '<html><head><title>No report</title></head><body><h1>Report unavailable</h1><p>No Playwright HTML report was produced for this run.</p></body></html>' \
              > published-reports/$TIMESTAMP/index.html
          fi
          [ -f execution-time.txt ] && cp execution-time.txt published-reports/$TIMESTAMP/
          [ -f shard-times.json ]   && cp shard-times.json   published-reports/$TIMESTAMP/
          [ -f test-results.json ]  && cp test-results.json  published-reports/$TIMESTAMP/
          [ -f workflow-time.txt ]  && cp workflow-time.txt  published-reports/$TIMESTAMP/
          echo "$FAILED_STAGE" > published-reports/$TIMESTAMP/failed-stage.txt
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Download Shard Statuses
        uses: actions/download-artifact@v4
        with:
          path: all-shard-statuses
          pattern: shard-*-status
          merge-multiple: true
        continue-on-error: true

      - name: Aggregate Shard Statuses
        id: aggregate-shard-status
        run: |
          if [ "$FAILED_STAGE" = "auth" ]; then
            FINAL_STATUS="Failed"
          else
            FINAL_STATUS="Passed"
            for report in $(find all-shard-statuses -name "shard-*-status.txt" 2>/dev/null); do
              if grep -q "Failed" "$report"; then FINAL_STATUS="Failed"; break; fi
            done
          fi
          echo "Final test status: $FINAL_STATUS  (failed stage: $FAILED_STAGE)"
          echo "{ \"timestamp\": \"$TIMESTAMP\", \"status\": \"$FINAL_STATUS\", \"environment\": \"$TEST_ENV\", \"failedStage\": \"$FAILED_STAGE\" }" \
            > "published-reports/$TIMESTAMP/status.json"
          echo "FINAL_STATUS=$FINAL_STATUS" >> $GITHUB_ENV
        shell: bash

      - name: Update Index Page
        run: |
          git fetch origin
          git checkout Main
          git pull --rebase origin Main || echo "No changes to pull"

          mkdir -p /tmp/scripts
          cp scripts/generate-dashboard.js /tmp/scripts/generate-dashboard.js

          if [ ! -f "test-results-history/consolidated.json" ]; then
              mkdir -p test-results-history
              echo '{"runs":[]}' > test-results-history/consolidated.json
          fi

          EXEC_TIME_SEC=0
          if [ -f "published-reports/$TIMESTAMP/execution-time.txt" ]; then
            RAW_TIME=$(cat "published-reports/$TIMESTAMP/execution-time.txt")
            EXEC_TIME_SEC=$(echo "$RAW_TIME" | awk '
              {
                for (i=1;i<=NF;i++) {
                  if ($i ~ /hr/)  h=$(i-1)
                  if ($i ~ /min/) m=$(i-1)
                  if ($i ~ /sec/) s=$(i-1)
                }
                print (h*3600 + m*60 + s)
              }
            ')
          fi

          CURRENT_RUN=$(cat <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "environment": "$TEST_ENV",
            "counts": {
              "executed": $EXECUTED_TESTS,
              "passed":   $PASSED_TESTS,
              "failed":   $FAILED_TESTS,
              "flaky":    $FLAKY_TESTS
            },
            "executionTimeSec": $EXEC_TIME_SEC
          }
          EOF
          )

          if [ "$EXECUTED_TESTS" -gt 0 ]; then
            jq --argjson newRun "$CURRENT_RUN" '.runs += [$newRun]' \
              test-results-history/consolidated.json > temp.json && mv temp.json test-results-history/consolidated.json
            jq '{ runs: (.runs | sort_by(.timestamp) | reverse | .[0:30]) }' \
              test-results-history/consolidated.json > temp.json && mv temp.json test-results-history/consolidated.json
          else
            echo "⚠️  Zero tests executed — skipping consolidated.json update to preserve history slots."
          fi

          git add test-results-history/consolidated.json
          git commit -m "Update test history with run from $TIMESTAMP" || echo "No changes to commit"
          git push origin Main || echo "No changes to push"

          if ! CONSOLIDATED_HISTORY=$(jq '.' test-results-history/consolidated.json 2>/dev/null); then
              CONSOLIDATED_HISTORY='{"runs":[]}'
          fi

          git fetch origin
          git checkout gh-pages
          git pull --rebase origin gh-pages || echo "No changes to pull"

          INDEX_FILE="published-reports/index.html"
          TIMESTAMP_REGEX="^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$"

          ROWS_JSON="["
          for dir in $(find published-reports/ -maxdepth 1 -mindepth 1 -type d | sort -r); do
            DIR_TIMESTAMP=$(basename "$dir")
            if [[ $DIR_TIMESTAMP =~ $TIMESTAMP_REGEX ]]; then
              if [ -f "published-reports/$DIR_TIMESTAMP/index.html" ]; then
                DATE_PART=$(echo $DIR_TIMESTAMP | cut -d'_' -f1)
                TIME_PART=$(echo $DIR_TIMESTAMP | cut -d'_' -f2 | sed 's/-/:/g')

                ROW_STATUS="Unknown"; ROW_ENV=""; ROW_FAILED_STAGE=""
                if [ -f "published-reports/$DIR_TIMESTAMP/status.json" ]; then
                  ROW_STATUS=$(jq -r '.status'               "published-reports/$DIR_TIMESTAMP/status.json" | xargs)
                  ROW_ENV=$(jq    -r '.environment // ""'    "published-reports/$DIR_TIMESTAMP/status.json" | xargs)
                  ROW_FAILED_STAGE=$(jq -r '.failedStage // ""' "published-reports/$DIR_TIMESTAMP/status.json" | xargs)
                  echo "FINAL_STATUS=$ROW_STATUS" >> $GITHUB_ENV
                fi

                EXEC_TIME="N/A"
                [ -f "published-reports/$DIR_TIMESTAMP/execution-time.txt" ] && \
                  EXEC_TIME=$(cat "published-reports/$DIR_TIMESTAMP/execution-time.txt")

                SHARD_TIMES="[]"
                [ -f "published-reports/$DIR_TIMESTAMP/shard-times.json" ] && \
                  SHARD_TIMES=$(cat "published-reports/$DIR_TIMESTAMP/shard-times.json")

                WORKFLOW_TIME="N/A"
                [ -f "published-reports/$DIR_TIMESTAMP/workflow-time.txt" ] && \
                  WORKFLOW_TIME=$(cat "published-reports/$DIR_TIMESTAMP/workflow-time.txt")

          ROWS_JSON+="{\"date\":\"$DATE_PART\",\"time\":\"$TIME_PART\",\"link\":\"./$DIR_TIMESTAMP/index.html\",\"status\":\"$ROW_STATUS\",\"environment\":\"$ROW_ENV\",\"failedStage\":\"$ROW_FAILED_STAGE\",\"execTime\":\"$EXEC_TIME\",\"workflowTime\":\"$WORKFLOW_TIME\",\"shardTimes\":$SHARD_TIMES},"
              fi
            fi
          done
          ROWS_JSON="${ROWS_JSON%,}]"

          echo "$CONSOLIDATED_HISTORY" > /tmp/consolidated_data.json
          echo "$ROWS_JSON"            > /tmp/rows_data.json

          node /tmp/scripts/generate-dashboard.js \
            /tmp/consolidated_data.json \
            /tmp/rows_data.json \
            "$INDEX_FILE"

      - name: Cleanup old published reports and history (keep 60 days)
        run: |
          find published-reports/ -maxdepth 1 -mindepth 1 -type d | while read dir; do
            DIRNAME=$(basename "$dir")
            DIRDATE=$(echo $DIRNAME | cut -d'_' -f1)
            if [[ $DIRDATE =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              REPORT_DATE=$(date -d "$DIRDATE" +%s)
              NOW_DATE=$(date +%s)
              AGE=$(( (NOW_DATE - REPORT_DATE) / 86400 ))
              if [ $AGE -gt 60 ]; then
                echo "Deleting old report: $dir (age: $AGE days)"
                rm -rf "$dir"
              fi
            fi
          done
          if [ -f "test-results-history/consolidated.json" ]; then
            jq --arg cutoff "$(date -d '60 days ago' +%Y-%m-%d)" \
              '{ runs: (.runs | map(select(.timestamp | split("_")[0] >= $cutoff))) }' \
              test-results-history/consolidated.json > temp.json && mv temp.json test-results-history/consolidated.json
          fi
          git commit -m "Cleanup: Remove reports and history older than 60 days" || echo "No old reports/history to remove"
          git push origin Main || echo "No changes to push"
          git push origin gh-pages || echo "No changes to push"

      - name: Commit Current Report to GitHub Pages
        run: |
          git add published-reports/$TIMESTAMP/
          git commit -m "Update Playwright reports with $TIMESTAMP"
          git push origin gh-pages

      - name: Set FINAL_STATUS from status.json
        run: |
          STATUS=$(jq -r '.status' published-reports/$TIMESTAMP/status.json)
          echo "FINAL_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Notify on Execution
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "SIMS Finance — Playwright Tests ${{ env.FINAL_STATUS }} (stage: ${{ env.FAILED_STAGE }})"
          body: |
            Hi,

            Automated SIMS Finance Playwright Tests Execution Status:

            🧪 Result:       ${{ env.FINAL_STATUS }}
            🚦 Failed stage: ${{ env.FAILED_STAGE }}
            🕒 Run time:     ${{ env.TIMESTAMP }}

            View the report and dashboard:
            https://pruthvirajqa2dev.github.io/playwright-SIMS-Finance/

            Regards,
            SIMS Finance QA Team
          to: pruthviraj.pardeshi@parentpay.com
          from: ${{ secrets.EMAIL_USERNAME }}
          # cc: princy.rajkumar@parentpay.com  # temporarily excluded

      - name: Upload merged test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-results
          path: test-results.json
          retention-days: 1
        continue-on-error: true

  # =========================================================================
  # JOB 4 — AI Intelligence (downstream; non-blocking)
  # Runs after merge-reports regardless of test outcome.
  # All steps are continue-on-error so AI failures NEVER block Pages deploy.
  # =========================================================================
  ai-intelligence:
    name: 🤖 AI Intelligence
    needs: [merge-reports]
    if: ${{ always() && needs.merge-reports.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true # job-level: workflow always proceeds to deploy
    permissions:
      contents: write
    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      ENABLE_NETWORK_CAPTURE: "true"
      GH_REPO_OWNER: ${{ github.repository_owner }}
      GH_REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Download per-shard network traces
        uses: actions/download-artifact@v4
        with:
          path: /tmp/shard-traces
          pattern: network-traces-shard-*
          merge-multiple: false
        continue-on-error: true

      - name: Merge shard traces → network-traces.json
        run: |
          node scripts/merge-trace-shards.js \
            /tmp/shard-traces \
            ai-outputs/traces/network-traces.json
          echo "── Trace merge result ───────────────────────────────────────────────"
          if [ -f ai-outputs/traces/network-traces.json ]; then
            TRACE_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('ai-outputs/traces/network-traces.json','utf8')); console.log(Array.isArray(d)?d.length:0)" 2>/dev/null || echo 0)
            echo "✅ network-traces.json ready: ${TRACE_COUNT} trace(s)"
          else
            echo "⚠️  network-traces.json not produced — AI will use existing seed or skip capture"
          fi
        continue-on-error: true

      - name: Download merged test results
        uses: actions/download-artifact@v4
        with:
          name: merged-test-results
          path: .
        continue-on-error: true

      - name: Configure Git
        run: |
          git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
          git config --global user.name "pruthvirajqa2dev"

      - name: Checkout Main for history
        run: |
          git fetch origin
          git checkout Main
          git pull --rebase origin Main || echo "No changes to pull"

      - name: Run AI pipeline
        id: ai-run
        run: npm run ai:full
        continue-on-error: true

      - name: Upload AI outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-intelligence-outputs
          path: ai-outputs/reports/
          retention-days: 1
        continue-on-error: true

      - name: Stash scripts and AI reports before branch switch
        run: |
          mkdir -p /tmp/ai-scripts /tmp/ai-reports
          # publish-ai-intelligence.js does require('./merge-trace-shards') so both must travel together
          cp scripts/publish-ai-intelligence.js /tmp/ai-scripts/
          cp scripts/merge-trace-shards.js      /tmp/ai-scripts/
          cp -r ai-outputs/reports/. /tmp/ai-reports/
          # Also stash the compiled HTML report so it can be published to latest/
          [ -f ai-outputs/ai-report.html ] && cp ai-outputs/ai-report.html /tmp/ai-reports/../ai-report.html || true
        continue-on-error: true

      - name: Checkout gh-pages for publishing
        run: |
          git fetch origin
          git checkout gh-pages 2>/dev/null || git checkout -b gh-pages
          # Use reset instead of pull --rebase so a force-pushed orphan branch is handled safely.
          git reset --hard origin/gh-pages
        continue-on-error: true

      - name: Publish AI intelligence to gh-pages
        id: ai-publish
        run: |
          # Restore AI reports (removed when we switched to gh-pages)
          mkdir -p ai-outputs/reports ai-outputs
          cp -r /tmp/ai-reports/. ai-outputs/reports/
          [ -f /tmp/ai-report.html ] && cp /tmp/ai-report.html ai-outputs/ai-report.html || true
          # Use the same TIMESTAMP as the Playwright run for 1:1 history correlation
          TIMESTAMP="${{ needs.merge-reports.outputs.timestamp }}"
          if [ -z "$TIMESTAMP" ]; then
            echo "⚠️  merge-reports timestamp not available — using current time as fallback"
            TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          fi
          echo "Publishing AI intelligence for run: $TIMESTAMP"
          # NODE_PATH ensures require("glob") resolves from the workspace node_modules
          # even though the script runs from /tmp (where node_modules is not present).
          NODE_PATH="$(pwd)/node_modules" node /tmp/ai-scripts/publish-ai-intelligence.js \
            --timestamp "$TIMESTAMP" \
            --reports   ai-outputs/reports \
            --dest      published-reports
        continue-on-error: true

      - name: Commit AI intelligence to gh-pages
        run: |
          git add published-reports/ai-intelligence/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "AI intelligence: update for run ${{ github.run_id }}"
          git push origin gh-pages || echo "Nothing to push"
        continue-on-error: true

      - name: Emit AI step summary
        if: always()
        run: |
          echo "## 🤖 AI Intelligence Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.ai-run.outcome }}" = "success" ]; then
            echo "| AI pipeline | ✅ completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| AI pipeline | ⚠️ errors (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.ai-publish.outcome }}" = "success" ]; then
            echo "| Publish to gh-pages | ✅ done |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Publish to gh-pages | ⚠️ errors |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ai-outputs/traces/network-traces.json ]; then
            TRACE_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('ai-outputs/traces/network-traces.json','utf8')); console.log(Array.isArray(d)?d.length:0)" 2>/dev/null || echo '?')
            echo "**Traces merged:** ${TRACE_COUNT}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Traces merged:** none (capture not available)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f published-reports/ai-intelligence/latest/manifest.json ]; then
            SECTIONS=$(node -e "const m=JSON.parse(require('fs').readFileSync('published-reports/ai-intelligence/latest/manifest.json','utf8')); console.log((m.sectionsAvailable||[]).join(', ') || 'none')" 2>/dev/null || echo '?')
            ENDPOINTS=$(node -e "const m=JSON.parse(require('fs').readFileSync('published-reports/ai-intelligence/latest/manifest.json','utf8')); console.log(m.endpointCount||0)" 2>/dev/null || echo '?')
            echo "**Sections published:** ${SECTIONS}" >> $GITHUB_STEP_SUMMARY
            echo "**Unique endpoints:** ${ENDPOINTS}" >> $GITHUB_STEP_SUMMARY
            CORR_TS="${{ needs.merge-reports.outputs.timestamp }}"
            [ -n "$CORR_TS" ] && echo "**Correlated run:** \`${CORR_TS}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Pages deploy proceeds regardless of AI status._" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # JOB 5 — Deploy to GitHub Pages
  # Waits for BOTH merge-reports AND ai-intelligence so the full gh-pages
  # branch (dashboard + AI artifacts) is deployed in one shot.
  # Uses always() so a failing ai-intelligence never blocks deploy.
  # =========================================================================
  Deploy-to-GitHub-Pages:
    name: Deploy to GitHub Pages
    needs: [merge-reports, ai-intelligence]
    if: ${{ always() && needs.merge-reports.result != 'skipped' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v2

      - name: Diagnose Pages artifact size and largest content
        run: |
          set -e
          ROOT="published-reports"
          if [ ! -d "$ROOT" ]; then
            echo "::error::Pages root '$ROOT' not found"
            exit 1
          fi

          TOTAL_BYTES=$(du -sb "$ROOT" | awk '{print $1}')
          TOTAL_GB=$(awk "BEGIN {printf \"%.3f\", $TOTAL_BYTES/1024/1024/1024}")
          echo "Pages artifact size: ${TOTAL_BYTES} bytes (${TOTAL_GB} GB)"

          echo "Top 20 largest directories under $ROOT:"
          du -sb "$ROOT"/* 2>/dev/null | sort -nr | head -20 || true

          echo "Top 20 largest files under $ROOT:"
          find "$ROOT" -type f -printf "%s %p\n" | sort -nr | head -20 || true

          if [ "$TOTAL_BYTES" -gt 1073741824 ]; then
            echo "::warning::Pages artifact exceeds 1GB (${TOTAL_GB} GB)"
          fi
          if [ "$TOTAL_BYTES" -gt 3221225472 ]; then
            echo "::warning::Pages artifact exceeds 3GB (${TOTAL_GB} GB)"
          fi
          if [ "$TOTAL_BYTES" -gt 5368709120 ]; then
            echo "::warning::Pages artifact exceeds 5GB (${TOTAL_GB} GB)"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: published-reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
