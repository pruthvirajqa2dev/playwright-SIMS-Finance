name: Playwright Tests

on:
    workflow_dispatch:
    push:
        branches: [Main]
    pull_request:
        branches: [Main]
    schedule:
        - cron: "0 8 * * *" # Runs at 8:00 AM UTC daily (UK time during winter)

jobs:
    playwright-test:
        name: 🧪 SIMS Finance Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
        if: ${{ always() }}
        timeout-minutes: 60
        continue-on-error: true
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                project: [chromium]
                shardIndex: [1, 2]
                shardTotal: [2]

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests for shard ${{ matrix.shardIndex }}
              id: run-tests
              run: |
                  set +e
                  npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --workers=1;
                  echo "STATUS_CODE=$?" >> $GITHUB_ENV
                  #Rename the results file to include shard index
                  mv test-results.json test-results-${{ matrix.shardIndex }}.json
                  echo "Current directory:"
                  pwd
                  echo "Files in current directory:"
                  ls -l
            - name: Upload Test Results for Shard ${{ matrix.shardIndex }}
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.shardIndex }}
                  path: test-results-${{ matrix.shardIndex }}.json
                  retention-days: 30
            - name: Save Test Status for Shard ${{ matrix.shardIndex }}
              if: always()
              run: |
                  if [ $STATUS_CODE -ne 0 ]; then
                    echo "Failed" > shard-${{ matrix.shardIndex }}-status.txt
                  else
                    echo "Passed" > shard-${{ matrix.shardIndex }}-status.txt
                  fi
                  echo "Exit status: $?"
              shell: bash
            - name: Upload Shard Status
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: shard-${{ matrix.shardIndex }}-status
                  path: shard-${{ matrix.shardIndex }}-status.txt

            - uses: actions/cache@v3
              if: always()
              with:
                  path: blob-report-${{ matrix.shardIndex }}
                  key: playwright-blob-report-${{ matrix.shardIndex }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: blob-report-${{ matrix.shardIndex }}
                  path: blob-report
                  retention-days: 30

    merge-reports:
        name: Merging executed reports
        needs: [playwright-test]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            #Restore Cached Reports
            - name: Restore Cached Reports
              uses: actions/cache@v3
              with:
                  path: all-blob-reports
                  key: playwright-blob-report
            #Download artifacts
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-blob-reports
                  pattern: blob-report-*
                  merge-multiple: true
            #Add these steps before the merge
            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Download Test Results from Shards
              uses: actions/download-artifact@v4
              with:
                  path: test-results
                  pattern: test-results-*
                  merge-multiple: true

            - name: List Downloaded Results
              run: |
                  echo "Contents of test-results directory:"
                  ls -la test-results/
                  echo "Full path of test results:"
                  find test-results/ -name "*.json"

            #Merge Playwright reports
            - name: Merge Playwright reports
              run: npx playwright merge-reports --reporter html ./all-blob-reports
            #Configure Git User
            - name: Configure Git User
              run: |
                  git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
                  git config --global user.name "pruthvirajqa2dev"
            #Pull from Main branch
            - name: Pull from Main branch
              run: |
                  git fetch origin
                  git checkout Main  #Checkout the existing Main branch
                  git pull --rebase origin Main || echo "No changes to pull"
            - name: Merge Test Results
              run: |
                  #Create a template for the merged file
                  echo '{
                    "config": null,
                    "suites": [],
                    "errors": [],
                    "stats": {
                      "startTime": null,
                      "duration": 0,
                      "expected": 0,
                      "skipped": 0,
                      "unexpected": 0,
                      "flaky": 0
                    }
                  }' > merged-results.json

                  # Merge the results using jq
                  jq -s '
                    reduce .[1:][] as $item (.[0];
                      .suites += $item.suites |
                      .errors += $item.errors |
                      .stats.expected += $item.stats.expected |
                      .stats.skipped += $item.stats.skipped |
                      .stats.unexpected += $item.stats.unexpected |
                      .stats.flaky += $item.stats.flaky |
                      .stats.duration += $item.stats.duration |
                      if .stats.startTime == null or ($item.stats.startTime < .stats.startTime) then
                        .stats.startTime = $item.stats.startTime
                      else . end |
                      if .config == null then .config = $item.config else . end
                    )
                  ' merged-results.json test-results/test-results-*.json > test-results.json

            #Parse Test Results and Set Variables
            - name: Parse Test Results and Set Variables
              run: node ./src/config/parse-json-report.js
            #Use Environment Variables
            - name: Use Environment Variables
              run: |
                  echo "Executed Tests: ${{ env.EXECUTED_TESTS }}"
                  echo "Passed Tests: ${{ env.PASSED_TESTS }}"
                  echo "Failed Tests: ${{ env.FAILED_TESTS }}"
                  echo "Flaky Tests: ${{ env.FLAKY_TESTS }}"
            #Stash untracked files
            - name: Stash untracked files
              run: |
                  git stash push -m "Stashing untracked report files" --include-untracked
            #Display JSON report (formatted)
            - name: Display JSON report (formatted)
              if: always()
              run: |
                  echo "Formatted JSON report:"
                  echo "Current directory:"
                  pwd
                  echo "Files in current directory:"
                  ls -l
                  jq '.' test-results.json
            #Pull from gh-pages branch
            - name: Pull from gh-pages branch
              run: |
                  git fetch origin
                  git checkout gh-pages  # Checkout the existing gh-pages branch
                  git pull --rebase origin gh-pages || echo "No changes to pull"
            - name: Restore stashed untracked files
              run: |
                  git stash pop || echo "No stashed files to restore"
            - name: Download Existing Reports from GitHub Pages
              run: |
                  git clone --depth 1 --branch gh-pages https://github.com/pruthvirajqa2dev/SIMS-Finance--pw-non-cucumber existing-reports/
                  mkdir -p published-reports
                  cp -r existing-reports/* published-reports/
            - name: Add Current Report with Timestamp
              run: |
                  TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
                  mkdir -p published-reports/$TIMESTAMP
                  cp -r playwright-report/* published-reports/$TIMESTAMP
                  echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
            - name: Download Shard Statuses
              uses: actions/download-artifact@v4
              with:
                  path: all-shard-statuses
                  pattern: shard-*-status
                  merge-multiple: true

            - name: Aggregate Shard Statuses
              id: aggregate-shard-status
              run: |
                  FINAL_STATUS="Passed"

                  for report in all-shard-statuses/shard-*-status.txt; do
                    if grep -q "Failed" "$report"; then
                      FINAL_STATUS="Failed"
                      break
                    fi
                  done
                  echo "Final test status: $FINAL_STATUS"
                  echo "{ \"timestamp\": \"$TIMESTAMP\", \"status\": \" $FINAL_STATUS\" }" > "published-reports/$TIMESTAMP/status.json"
                  echo "Test status from previous job: $FINAL_STATUS"
                  echo "TEST_STATUS=$FINAL_STATUS" >> $GITHUB_ENV
              shell: bash
            - name: Update Index Page
              run: |
                  INDEX_FILE="published-reports/index.html"
                  TIMESTAMP_REGEX="^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$"
                   echo "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'>
                    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
                    <title>Playwright Reports</title>
                    <script src='https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js'></script>
                    <style>
                      body {font-family:Arial, sans-serif; background-color:#f4f4f9; color:#333;}
                      table {width:90%; margin:2em auto; border-collapse:collapse; background:white; box-shadow:0 2px 8px rgba(0, 0, 0, 0.1); }
                      th, td { padding:12px; text-align:left; border:1px solid #ddd; }
                      th { background-color:#4CAF50; color:white; cursor: pointer; }
                      th:hover { background-color:#45a049; }
                      tr:nth-child(even) { background-color:#f9f9f9; }
                      tr:hover { background-color:#f1f1f1; }
                      .failed { background-color:#ffe6e6 !important;}
                      .passed { background-color:#d4f8d4 !important;}
                      a {color:#4CAF50; text-decoration:none; }
                      a:hover { text-decoration:underline; }
                      .filters { margin: 20px auto; width: 90%; }
                      .filters input, .filters select { 
                        padding: 8px;
                        margin: 0 10px;
                        border: 1px solid #ddd;
                        border-radius: 4px;
                      }
                      .sort-icon::after {
                        content: '↕';
                        margin-left: 5px;
                      }
                      .sort-asc::after {
                        content: '↑';
                      }
                      .sort-desc::after {
                        content: '↓';
                      }
                      .chart-container {
                        width: 90%;
                        margin: 2em auto;
                        background: white;
                        padding: 20px;
                        border-radius: 8px;
                        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                      }
                      .chart-wrapper {
                        height: 400px;
                        position: relative;
                        margin-bottom: 20px;
                      }
                      .slider-container {
                        width: 90%;
                        margin: 1em auto;
                        padding: 10px;
                      }
                      input[type='range'] {
                        width: 100%;
                      }
                      .chart-controls {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 1em;
                      }
                      .data-point-count {
                        font-size: 0.9em;
                        color: #666;
                      }
                    </style>
                    </head>
                    <body>
                      <header>
                        <h1>Playwright Reports</h1>
                        <p>Explore the results of the test runs below.</p>
                      </header>
                      
                      <div class='filters'>
                        <input type='date' id='dateFilter' placeholder='Filter by date'>
                        <select id='statusFilter'>
                          <option value=''>All Statuses</option>
                          <option value='Passed'>Passed</option>
                          <option value='Failed'>Failed</option>
                        </select>
                      </div>
                      <main>
                        <table id='reportsTable'>
                          <thead>
                            <tr>
                              <th data-sort='date' class='sort-icon'>Date</th>
                              <th>Time</th>
                              <th>Report Link</th>
                              <th data-sort='status' class='sort-icon'>Status</th>
                            </tr>
                          </thead>
                          <tbody>" >> $INDEX_FILE

                  # Add table rows here
                  for dir in $(find published-reports/ -maxdepth 1 -mindepth 1 -type d | sort); do
                    TIMESTAMP=$(basename "$dir")
                    if [[ $TIMESTAMP =~ $TIMESTAMP_REGEX ]]; then
                      DATE_PART=$(echo $TIMESTAMP | cut -d'_' -f1)
                      TIME_PART=$(echo $TIMESTAMP | cut -d'_' -f2 | sed 's/-/:/g')
                      
                      STATUS="Unknown"
                      CSS_CLASS=""
                      EXECUTED=0
                      PASSED=0
                      FAILED=0
                      FLAKY=0

                      # Debug output
                      echo "Processing directory: $TIMESTAMP"
                      echo "Looking for test-results.json in: published-reports/$TIMESTAMP/"
                      
                      # Read test counts from test-results.json
                      if [ -f "published-reports/$TIMESTAMP/test-results.json" ]; then
                        echo "Found test-results.json"
                        EXECUTED=$(jq '.stats.expected' "published-reports/$TIMESTAMP/test-results.json")
                        FAILED=$(jq '.stats.unexpected' "published-reports/$TIMESTAMP/test-results.json")
                        FLAKY=$(jq '.stats.flaky' "published-reports/$TIMESTAMP/test-results.json")
                        PASSED=$(echo "$EXECUTED - $FAILED - $FLAKY" | bc)
                        
                        # Debug output
                        echo "Test counts - Executed: $EXECUTED, Passed: $PASSED, Failed: $FAILED, Flaky: $FLAKY"
                      fi

                      if [ -f "published-reports/$TIMESTAMP/status.json" ]; then
                        STATUS=$(jq -r '.status' "published-reports/$TIMESTAMP/status.json")
                        STATUS=$(echo "$STATUS" | xargs)
                        if [ "$STATUS" = "Failed" ]; then
                          CSS_CLASS="failed"
                        fi
                        if [ "$STATUS" = "Passed" ]; then
                          CSS_CLASS="passed"
                        fi
                      fi

                      LINK="<a href='./$TIMESTAMP/index.html' target='_blank'>View Report</a>"
                      echo "<tr data-date='$DATE_PART' data-executed='$EXECUTED' data-passed='$PASSED' data-failed='$FAILED' data-flaky='$FLAKY'><td>$DATE_PART</td><td>$TIME_PART</td><td>$LINK</td><td class='$CSS_CLASS'>$STATUS</td></tr>" >> $INDEX_FILE
                    fi
                  done

                  # Close the table and add the chart container
                  echo "</tbody></table>

                        <div class='chart-container'>
                          <h2>Test Execution Trends</h2>
                          <div class='chart-controls'>
                            <div class='data-point-count'>Showing <span id='visiblePoints'>0</span> of <span id='totalPoints'>0</span> data points</div>
                          </div>
                          <div class='chart-wrapper'>
                            <canvas id='trendsChart'></canvas>
                          </div>
                          <div class='slider-container'>
                            <input type='range' id='dataSlider' min='5' max='50' value='10'>
                            <label for='dataSlider'>Number of data points to show: <span id='sliderValue'>10</span></label>
                          </div>
                        </div>
                      </main>

                      <script>
                        document.addEventListener('DOMContentLoaded', function() {
                          console.log('DOM Content Loaded');
                          
                          // Initialize the chart
                          function initializeChart() {
                            console.log('Initializing chart');
                            const rows = Array.from(document.querySelectorAll('#reportsTable tbody tr'));
                            console.log('Found rows:', rows.length);
                            
                            if (rows.length === 0) {
                              console.log('No data rows found');
                              return;
                            }

                            const chartData = {
                              labels: [],
                              datasets: [
                                {
                                  label: 'Executed Tests',
                                  data: [],
                                  borderColor: 'rgb(75, 192, 192)',
                                  tension: 0.1
                                },
                                {
                                  label: 'Passed Tests',
                                  data: [],
                                  borderColor: 'rgb(75, 192, 75)',
                                  tension: 0.1
                                },
                                {
                                  label: 'Failed Tests',
                                  data: [],
                                  borderColor: 'rgb(255, 99, 132)',
                                  tension: 0.1
                                },
                                {
                                  label: 'Flaky Tests',
                                  data: [],
                                  borderColor: 'rgb(255, 159, 64)',
                                  tension: 0.1
                                }
                              ]
                            };

                            rows.forEach(row => {
                              const date = row.cells[0].textContent;
                              const time = row.cells[1].textContent;
                              
                              // Debug logging
                              console.log('Processing row:', {
                                date,
                                time,
                                executed: row.dataset.executed,
                                passed: row.dataset.passed,
                                failed: row.dataset.failed,
                                flaky: row.dataset.flaky
                              });

                              chartData.labels.push(\`\${date} \${time}\`);
                              chartData.datasets[0].data.push(parseInt(row.dataset.executed) || 0);
                              chartData.datasets[1].data.push(parseInt(row.dataset.passed) || 0);
                              chartData.datasets[2].data.push(parseInt(row.dataset.failed) || 0);
                              chartData.datasets[3].data.push(parseInt(row.dataset.flaky) || 0);
                            });

                            const ctx = document.getElementById('trendsChart');
                            if (!ctx) {
                              console.error('Canvas element not found');
                              return;
                            }

                            console.log('Creating chart with data:', chartData);

                            new Chart(ctx, {
                              type: 'line',
                              data: chartData,
                              options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                  y: {
                                    beginAtZero: true,
                                    title: {
                                      display: true,
                                      text: 'Number of Tests'
                                    }
                                  },
                                  x: {
                                    title: {
                                      display: true,
                                      text: 'Date and Time'
                                    }
                                  }
                                },
                                plugins: {
                                  legend: {
                                    position: 'bottom'
                                  }
                                }
                              }
                            });
                          }

                          // Initialize the chart when the page loads
                          initializeChart();
                        });
                      </script>
                    </body></html>" >> $INDEX_FILE
            - name: Commit Current Report to GitHub Pages
              run: |
                  git add published-reports/$TIMESTAMP/
                  git commit -m "Update Playwright reports with $TIMESTAMP"
                  git push origin gh-pages
            - name: Upload Combined Reports for Pages
              uses: actions/upload-artifact@v4
              with:
                  name: upload-html-reports
                  path: published-reports/
            - name: Wait for Artifact to be available
              run: sleep 1 # Wait for 1 second to allow artifact processing
            - name: Setup Pages
              uses: actions/configure-pages@v2
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v1
              with:
                  name: upload-html-reports
                  path: published-reports/
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v1
              with:
                  artifact_name: upload-html-reports
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
