name: Playwright Tests

on:
    workflow_dispatch:
    push:
        branches: [Main]
    pull_request:
        branches: [Main]

jobs:
    playwright-test:
        name: 🧪 SIMS Finance Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
        if: ${{ always() }}
        timeout-minutes: 60
        continue-on-error: true
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                project: [chromium]
                shardIndex: [1, 2]
                shardTotal: [2]

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: |
                  npx playwright test --project=${{ matrix.project }} \
                  --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --workers=1
            - uses: actions/cache@v3
              with:
                  path: blob-report-${{ matrix.shardIndex }}
                  key: playwright-blob-report-${{ matrix.shardIndex }}
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: blob-report-${{ matrix.shardIndex }}
                  path: blob-report
                  retention-days: 30

    merge-reports:
        name: Merging executed reports
        needs: [playwright-test]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Restore Cached Reports
              uses: actions/cache@v3
              with:
                  path: all-blob-reports
                  key: playwright-blob-report
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-blob-reports
                  pattern: blob-report-*
                  merge-multiple: true
            - name: Merge Playwright reports
              run: npx playwright merge-reports --reporter html ./all-blob-reports
            - name: Configure Git User
              run: |
                  git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
                  git config --global user.name "pruthvirajqa2dev"
            - name: Check if gh-pages branch exists
              run: |
                  git fetch origin
                  if git show-ref --verify --quiet refs/heads/gh-pages; then
                    echo "gh-pages branch exists."
                  else
                    echo "gh-pages branch does not exist. Creating it."
                    git checkout --orphan gh-pages
                    git rm -rf .
                    git commit --allow-empty -m "Create gh-pages branch"
                    git push origin gh-pages
                  fi
            - name: Download Existing Reports from GitHub Pages
              run: |
                  git clone --depth 1 --branch gh-pages https://github.com/pruthvirajqa2dev/SIMS-Finance--pw-non-cucumber existing-reports
                  mkdir -p published-reports
                  cp -r existing-reports/* published-reports/ || true
            - name: Add Current Report with Timestamp
              run: |
                  TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
                  mkdir -p published-reports/$TIMESTAMP
                  cp -r playwright-report/* published-reports/$TIMESTAMP
                  echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
            - name: Update Index Page
              run: |
                  INDEX_FILE="published-reports/index.html"
                  echo "<html><body><h1>Playwright Reports</h1><table border='1'><tr><th>Run Timestamp</th><th>Report Link</th></tr>" > $INDEX_FILE
                  for dir in $(ls -d published-reports/*/); do
                    TIMESTAMP=$(basename $dir)
                    LINK="<a href='./$TIMESTAMP/index.html'>$TIMESTAMP</a>"
                    echo "<tr><td>$TIMESTAMP</td><td>$LINK</td></tr>" >> $INDEX_FILE
                  done
                  echo "</table></body></html>" >> $INDEX_FILE
            - name: Highlight Current Run
              run: |
                  cp -r published-reports/$TIMESTAMP published-reports/latest
            - name: Upload Combined Reports for Pages
              uses: actions/upload-artifact@v4
              with:
                  name: html-reports
                  path: published-reports/
            - name: Setup Pages
              uses: actions/configure-pages@v2
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v1
              with:
                  artifact_name: html-reports
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
