name: Playwright Tests

on:
    workflow_dispatch:
    push:
        branches: [Main]
    pull_request:
        branches: [Main]

jobs:
    playwright-test:
        name: 🧪 SIMS Finance Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        if: ${{ always() }}
        timeout-minutes: 60
        continue-on-error: true
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                project: [chromium]
                shardIndex: [1, 2]
                shardTotal: [2]

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: |
                  npx playwright test --project=${{ matrix.project }} \
                  --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --workers=1
            - uses: actions/cache@v3
              with:
                  path: blob-report-${{ matrix.shardIndex }}
                  key: playwright-blob-report-${{ matrix.shardIndex }}
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: blob-report-${{ matrix.shardIndex }}
                  path: blob-report
                  retention-days: 30

    merge-reports:
        name: Merging executed reports
        needs: [playwright-test]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: blob-report
                  path: blob-report
            - name: Merge Playwright reports
              run: npx playwright merge-reports --reporter html blob-report

            - name: Generate timestamped directory
              run: |
                  TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
                  mkdir -p published-reports/$TIMESTAMP
                  if [ -d "playwright-report" ] && [ "$(ls -A playwright-report)" ]; then
                      cp -r playwright-report/* published-reports/$TIMESTAMP
                      echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
                  else
                      echo "Error: playwright-report directory is empty or missing!" && exit 1
                  fi

            - name: Update index.html
              run: |
                  INDEX_FILE="published-reports/index.html"
                  TIMESTAMP_REGEX="^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$"
                  echo "<html><body><h1>Playwright Reports</h1><table border='1'><tr><th>Run Timestamp</th><th>Report Link</th></tr>" > $INDEX_FILE
                  for dir in $(find published-reports/ -maxdepth 1 -mindepth 1 -type d | sort); do
                      TIMESTAMP=$(basename $dir)
                      if [[ $TIMESTAMP =~ $TIMESTAMP_REGEX ]]; then
                          LINK="<a href='./$TIMESTAMP/index.html'>$TIMESTAMP</a>"
                          echo "<tr><td>$TIMESTAMP</td><td>$LINK</td></tr>" >> $INDEX_FILE
                      fi
                  done
                  echo "</table></body></html>" >> $INDEX_FILE

            - name: Sync latest report
              run: |
                  rm -rf published-reports/latest
                  ln -sfn $TIMESTAMP published-reports/latest

            - name: Commit updated reports
              run: |
                  git config --global user.email "154661815+pruthvirajqa2dev@users.noreply.github.com"
                  git config --global user.name "pruthvirajqa2dev"
                  git fetch origin gh-pages
                  git checkout gh-pages || git checkout --orphan gh-pages
                  rsync -av --exclude="published-reports" ./published-reports/ ./published-reports/
                  git add published-reports/
                  git commit -m "Update Playwright reports with $TIMESTAMP"
                  git push origin gh-pages
            - name: Setup Pages
              uses: actions/configure-pages@v2
            - name: Upload artifact for Pages
              uses: actions/upload-pages-artifact@v1
              with:
                  path: published-reports/
                  name: upload-html-reports
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v1
              with:
                  artifact_name: upload-html-reports
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
