name: Playwright Merge Proof

on:
  #Execute workflow on workflow_dispatch event to allow manual triggering of the workflow
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auth-gate:
    #JOB: Authentication Gate for Fail Fast
    name: Authentication Gate for Fail Fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - #Step 1: Checkout the repository
        uses: actions/checkout@v4
      - #Step 2: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - #Step 3: Install project dependencies
        name: Install dependencies
        run: npm ci
      - #Step 4: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - #Step 5: Install Playwright Browsers if cache is not hit
        name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - #Step 6: Install Playwright system dependencies if cache is hit
        name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - #Step 7: Run Auth Gate tests
        name: Run Auth Gate
        run: |
          set +e
          npx playwright test --project=auth --workers=1
          AUTH_EXIT=$?
          echo "AUTH_EXIT_CODE=$AUTH_EXIT" >> $GITHUB_ENV
          exit $AUTH_EXIT
      - #Step 8: Rename auth blob
        name: Rename auth blob
        if: always()
        run: |
          if [ -f blob-report/report.zip ]; then
            mv blob-report/report.zip blob-report/report-auth.zip
          fi

      - #Step 9: Upload auth blob
        name: Upload auth blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-auth
          path: blob-report

  postchecks:
    #JOB: Postchecks with Shards
    name: 🧪 Postchecks Shard ${{ matrix.shardIndex }}
    needs: auth-gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]

    steps:
      - #Step 1: Checkout the repository
        uses: actions/checkout@v4

      - #Step 2: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - #Step 3: Install project dependencies
        name: Install dependencies
        run: npm ci

      - #Step 4: Cache Playwright browsers
        name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - #Step 5: Install Playwright Browsers
        name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - #Step 6: Install Playwright system dependencies
        name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - #Step 7: Run shard
        name: Run shard
        run: |
          if [ "${{ matrix.shardIndex }}" = "1" ]; then
            GREP_PATTERN="RSS570 - Crystal Report @shard1"
          else
            GREP_PATTERN="Login and Logout @shard2"
          fi
            
          npx playwright test \
            --project=chromium-shard${{ matrix.shardIndex }} \
            --grep "$GREP_PATTERN" \
            --workers=1

      - #Step 8: Inspect blob-report folder
        name: Inspect blob-report folder
        if: always()
        run: |
          echo "========== BLOB REPORT =========="
          find blob-report -type f

      - #Step 10: Upload blob
        name: Upload blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report

  merge-reports:
    #JOB: Merge Reports Proof
    name: 📊 Merge Reports Proof
    needs:
      - auth-gate
      - postchecks
    if: always()
    runs-on: ubuntu-latest

    steps:
      - #Step 1: Checkout the repository
        uses: actions/checkout@v4

      - #Step 2: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - #Step 3: Install dependencies
        name: Install dependencies
        run: npm ci

      - #Step 4: Playwright version
        name: Playwright version
        run: |
          npx playwright --version
          npm ls @playwright/test

      - #Step 5: Download blobs
        name: Download blobs
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - #Step 6: Inspect downloaded blobs
        name: Inspect downloaded blobs
        run: |
          echo "========== DOWNLOADED FILES =========="
          find all-blob-reports -type f

      - #Step 7: Inspect zip contents
        name: Inspect zip contents
        run: |
          for f in all-blob-reports/*.zip
          do
            echo ""
            echo "=============================="
            echo "$f"
            echo "=============================="

            unzip -l "$f" | head -30

            echo ""
            echo "report.jsonl preview"

            unzip -p "$f" report.jsonl 2>/dev/null | head -5 || true
          done
      - #Step 8: Deep blob inspection
        name: Deep blob inspection
        run: |
          echo "===== ALL FILES ====="
          find all-blob-reports -type f        

          echo ""
          echo "===== ZIP COUNT ====="
          find all-blob-reports -name "*.zip" | wc -l        

          echo ""
          echo "===== ZIP NAMES ====="
          find all-blob-reports -name "*.zip"
      - #Step 9: Merge reports
        name: Merge reports
        run: |
          set +e

          mkdir merge-output  
          PLAYWRIGHT_HTML_OUTPUT_DIR=merge-output \ 
          npx playwright merge-reports --config playwright.merge.config.ts --reporter html ./all-blob-reports
          echo "===== SEARCHING ====="
          find . -type d | grep report || true
          find . -name "*.html" || true
          EXIT_CODE=$?

          echo "merge exit code: $EXIT_CODE"

          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - #Step 10: Inspect playwright-report folder
        name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
      - #Step 11: Post merge diagnostics
        name: Post merge diagnostics
        run: |
          echo "========== PLAYWRIGHT REPORT DIR =========="
          find . -name "playwright-report"

          echo ""
          echo "========== INDEX FILES =========="
          find . -name "index.html"

          echo ""
          echo "========== REPORT CONTENTS =========="
          find playwright-report -type f 2>/dev/null || true

      - #Step 12: Validate report
        name: Validate report
        run: |
          if [ ! -f playwright-report/index.html ]; then
            echo "❌ playwright-report/index.html not found"
            exit 1
          fi

          echo "✅ playwright-report/index.html exists"

      - #Step 13: Upload merged report
        name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report
