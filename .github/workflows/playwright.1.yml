name: Playwright Merge Proof

on:
    workflow_dispatch:

jobs:
    test:
        name: Shard ${{ matrix.shard }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - run: npm ci

            - name: Show Playwright Version
              run: npx playwright --version

            - name: Run Shard
              run: |
                  npx playwright test \
                    --shard=${{ matrix.shard }}/2

            - name: Rename Blob Report
              if: always()
              run: |
                  mkdir -p blob-report
                      
                  if [ -f blob-report/report.zip ]; then
                    mv blob-report/report.zip \
                       blob-report/report-shard-${{ matrix.shard }}.zip
                  fi
                      
                  find blob-report -type f

            - name: Upload Blob
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: blob-report-${{ matrix.shard }}
                  path: blob-report

    merge:
        runs-on: ubuntu-latest
        needs:
            - test
        if: always()
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - run: npm ci
            - name: Show Playwright Version
              run: npx playwright --version
            - name: Download Blobs
              uses: actions/download-artifact@v4
              with:
                  pattern: blob-report-*
                  path: all-blob-reports
                  merge-multiple: false
            - name: Inspect Downloaded Files
              run: |
                  echo "========== DOWNLOADED FILES =========="
                  find all-blob-reports -type f
            - name: Flatten Blob Reports
              run: |
                  mkdir -p merge-input
                  find all-blob-reports -name "*.zip" | while read f
                     do
                         cp "$f" merge-input/
                     done          
                     echo "========== MERGE INPUT =========="
                     find merge-input -type f

            - name: Merge Reports
              run: |
                  npx playwright merge-reports \
                  --reporter html \
                  merge-input
            - name: Verify HTML Report
              run: |
                  echo "========== REPORT OUTPUT =========="
                  find . -name "playwright-report"
                  find . -name "index.html"
                  if [ ! -f playwright-report/index.html ]; then
                     echo "playwright-report/index.html NOT FOUND"
                     exit 1
                   fi
                   echo "SUCCESS"
            - name: Upload HTML Report
              uses: actions/upload-artifact@v4
              with:
                  name: merged-playwright-report
                  path: playwright-report
