    // ── Scroll utilities (progress bar + active nav + back-to-top) ──────────
    // Active-tab strategy: on every scroll event, walk the sections array in
    // order and find the LAST one whose top edge is at or above the nav bottom
    // (64px). This is O(n) on scroll but n=7 — and it is 100% reliable
    // regardless of section height, unlike IntersectionObserver rootMargin.
    function useScrollEffects() {
      useEffect(function() {
        // Order MUST match the visual DOM order on the page.
        var sections = ['s-overview','s-top-risks','s-trends','s-regression','s-unstable','s-db','s-api','s-actions'];
        var navLinks = {};
        sections.forEach(function(id) {
          var a = document.querySelector('.dash-nav a[href="#' + id + '"]');
          if (a) navLinks[id] = a;
        });

        var bar = document.getElementById('scroll-progress');
        var btn = document.getElementById('back-to-top');
        var NAV_H = 64; // px — nav bar height + small buffer

        function setActive(id) {
          Object.values(navLinks).forEach(function(a) { a.classList.remove('active'); });
          if (id && navLinks[id]) navLinks[id].classList.add('active');
        }

        function onScroll() {
          var scrolled = window.scrollY;

          // Progress bar
          var total = document.documentElement.scrollHeight - window.innerHeight;
          if (bar) bar.style.width = (total > 0 ? (scrolled / total * 100) : 0) + '%';

          // Back-to-top button
          if (btn) {
            if (scrolled > 300) btn.classList.add('visible');
            else                btn.classList.remove('visible');
          }

          // Active nav: last section whose top is <= NAV_H from viewport top.
          // Special case: if scrolled near the bottom, force the last section active
          // (the final section may never reach the nav threshold if content is short).
          var nearBottom = (window.innerHeight + scrolled) >= (document.documentElement.scrollHeight - 80);
          var active = sections[0]; // default to first
          sections.forEach(function(id) {
            var el = document.getElementById(id);
            if (el && el.getBoundingClientRect().top <= NAV_H) active = id;
          });
          if (nearBottom) active = sections[sections.length - 1];
          setActive(active);
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll(); // run once on mount to set initial state

        return function() {
          window.removeEventListener('scroll', onScroll);
        };
      }, []);
    }

                                var fg = code >= 500 ? '#991b1b' : code >= 400 ? '#92400e' : '#166534';
                                return (
                                  <span key={si} style={{padding:'0.1rem 0.4rem',borderRadius:'4px',fontSize:'0.7rem',fontWeight:700,background:bg,color:fg,fontFamily:'monospace'}}>
                                    {sc[0]}: {sc[1]}
                                  </span>
                                );
                              })}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── Latency Outliers ── */}
          {latencyOL.length > 0 && (
            <div className="card">
              <div className="card-head">
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                  <h2>Latency Outliers</h2>
                  <i className="info-trigger" data-tooltip="Endpoints whose 95th percentile response time exceeded 3 000 ms across all calls in the session. p95 is used rather than mean to avoid outlier distortion — it represents the worst 5% of real user-facing latency. These are candidates for timeout-related test flakiness.">i</i>
                </div>
                <p>p95 &gt; 3 000 ms</p>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-700 text-white text-xs uppercase tracking-wide">
                    <tr>
                      <th className="px-4 py-3">Method</th>
                      <th className="px-4 py-3">Endpoint</th>
                      <th className="px-4 py-3 text-center">p95 (ms)</th>
                      <th className="px-4 py-3 text-center">Avg (ms)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {latencyOL.map(function(ep, li) {
                      var p95 = ep.p95Ms || 0;
                      var p95Color = p95 > 8000 ? '#dc2626' : p95 > 5000 ? '#d97706' : '#0f766e';
                      return (
                        <tr key={li} className="hover:bg-slate-50">
                          <td className="px-4 py-3"><MethodChip method={ep.method} /></td>
                          <td className="px-4 py-3 font-mono text-xs text-slate-700">{ep.normalizedPath}</td>
                          <td className="px-4 py-3 text-center font-bold" style={{color:p95Color}}>{p95}</td>
                          <td className="px-4 py-3 text-center text-slate-600 font-mono">{ep.avgMs || '—'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── Workflow Sequences ── */}
          {workflows.length > 0 && (
            <div className="card">
              <div className="card-head">
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                  <h2>Workflow Sequences</h2>
                  <i className="info-trigger" data-tooltip="Ordered API call sequences captured per test, named by the AI using SIMS Finance business context. Each workflow shows the API steps a test exercised, their HTTP methods, status codes, and latency. Useful for understanding which business operations each test covers at the API layer.">i</i>
                </div>
                <p>{workflows.length} test workflow{workflows.length !== 1 ? 's' : ''} mapped</p>
              </div>
              <div className="card-body" style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                {workflows.map(function(wf, wi) {
                  var allOk = wf.allSucceeded;
                  return (
                    <div key={wi} style={{border:'1px solid #e2e8f0',borderRadius:'8px',overflow:'hidden'}}>
                      {/* Workflow header */}
                      <div style={{padding:'0.65rem 1rem',background: allOk ? '#f0fdf4' : '#fff7ed',
                        borderBottom:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between',alignItems:'center',gap:'0.75rem',flexWrap:'wrap'}}>
                        <div>
                          <div style={{fontWeight:700,fontSize:'0.82rem',color:'#1e293b'}}>{wf.name || wf.testTitle}</div>
                          {wf.name && wf.name !== wf.testTitle && (
                            <div style={{fontSize:'0.68rem',color:'#94a3b8',marginTop:'0.1rem',fontStyle:'italic'}}>test: {wf.testTitle}</div>
                          )}
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexShrink:0}}>
                          <span style={{fontSize:'0.7rem',color:'#64748b'}}>{wf.steps ? wf.steps.length : 0} calls &middot; {wf.totalDurationMs}ms</span>
                          <span style={{padding:'0.15rem 0.55rem',borderRadius:'999px',fontSize:'0.68rem',fontWeight:700,
                            background: allOk ? '#d1fae5' : '#fee2e2', color: allOk ? '#065f46' : '#991b1b'}}>
                            {allOk ? '✓ All succeeded' : '⚠ Has errors'}
                          </span>
                        </div>
                      </div>
                      {/* Steps */}
                      <div style={{overflowX:'auto'}}>
                        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.75rem'}}>
                          <tbody>
                            {(wf.steps||[]).map(function(step, si) {
                              var code = step.responseStatus || 0;
                              var codeColor = code >= 500 ? '#dc2626' : code >= 400 ? '#d97706' : code >= 200 && code < 300 ? '#059669' : '#64748b';
                              var rowBg = (code >= 400) ? '#fff7f7' : si % 2 === 0 ? '#fff' : '#f8fafc';
                              return (
                                <tr key={si} style={{borderBottom:'1px solid #f1f5f9',background:rowBg}}>
                                  <td style={{padding:'0.4rem 0.75rem',color:'#94a3b8',fontFamily:'monospace',width:'2rem',textAlign:'right'}}>{si + 1}</td>
                                  <td style={{padding:'0.4rem 0.5rem',width:'4rem'}}><MethodChip method={step.method} /></td>
                                  <td style={{padding:'0.4rem 0.5rem',fontFamily:'monospace',color:'#334155',maxWidth:'280px',wordBreak:'break-all'}}>{step.normalizedPath}</td>
                                  <td style={{padding:'0.4rem 0.5rem',width:'3rem',textAlign:'center',fontWeight:700,fontFamily:'monospace',color:codeColor}}>{step.responseStatus}</td>
                                  <td style={{padding:'0.4rem 0.5rem',width:'5rem',textAlign:'right',color:'#64748b',fontFamily:'monospace'}}>{step.durationMs}ms</td>
                                  <td style={{padding:'0.4rem 0.75rem'}}><DomainChip domain={step.domain} /></td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ── Domain Breakdown ── */}
          {domainRows.length > 0 && (
            <div className="card">
              <div className="card-head">
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                  <h2>Coverage by Business Domain</h2>
                  <i className="info-trigger" data-tooltip="Endpoints classified by SIMS Finance business domain using deterministic URL path rules. Coverage shows which parts of the application were exercised at the API layer during this test session. Empty domains indicate no API traffic was observed for that area.">i</i>
                </div>
                <p>SIMS Finance domain classification of observed endpoints</p>
              </div>
              <div className="card-body">
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'0.6rem'}}>
                  {domainRows.map(function(d, di) {
                    var epList = d.endpoints;
                    return (
                      <div key={di} style={{padding:'0.65rem 0.85rem',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'8px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.45rem'}}>
                          <DomainChip domain={d.domain} />
                          <span style={{fontSize:'0.65rem',color:'#94a3b8'}}>{epList.length} endpoint{epList.length !== 1 ? 's' : ''}</span>
                        </div>
                        <div style={{display:'flex',flexDirection:'column',gap:'0.18rem'}}>
                          {epList.slice(0,5).map(function(ep, ei) {
                            return (
                              <code key={ei} style={{fontSize:'0.68rem',color:'#334155',fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block'}}>
                                {ep}
                              </code>
                            );
                          })}
                          {epList.length > 5 && (
                            <span style={{fontSize:'0.65rem',color:'#94a3b8'}}>+{epList.length - 5} more</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ── Repeated Calls ── */}
          {repeated.length > 0 && (
            <div className="card">
              <div className="card-head">
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                  <h2>Repeated API Calls</h2>
                  <i className="info-trigger" data-tooltip="Endpoints called more than 3 times within a single test. Repeated calls to the same endpoint in one test may indicate polling loops, missing caching, redundant data fetches, or tests that poll for state rather than reacting to events. High call counts on reference data endpoints (e.g. cost centres, VAT codes) suggest caching opportunities.">i</i>
                </div>
                <p>Endpoints called more than 3 times in a single test — potential caching or polling opportunities</p>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-700 text-white text-xs uppercase tracking-wide">
                    <tr>
                      <th className="px-4 py-3">Endpoint</th>
                      <th className="px-4 py-3 text-center">Total Calls</th>
                      <th className="px-4 py-3 text-center">Tests</th>
                      <th className="px-4 py-3 text-center">Avg / Test</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {repeated.map(function(ep, ri) {
                      return (
                        <tr key={ri} className="hover:bg-slate-50">
                          <td className="px-4 py-3 font-mono text-xs text-slate-700">{ep.normalizedPath}</td>
                          <td className="px-4 py-3 text-center font-bold text-amber-600">{ep.callCount}</td>
                          <td className="px-4 py-3 text-center text-slate-500">{ep.testCount}</td>
                          <td className="px-4 py-3 text-center text-slate-600">{ep.avgCallsPerTest ? ep.avgCallsPerTest.toFixed(1) : '—'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

        </div>
      );
    }

    function App() {
      const score       = trend.overallHealthScore ?? 0;
      const trendDir    = trend.trendDirection ?? 'Unknown';
      const generatedAt = trend.generatedAt
        ? new Date(trend.generatedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'UTC' }) + ' UTC'
        : '—';
      const reportBaseUrl = deep.reportBaseUrl || '';

      // ── Env runs modal state ───────────────────────────────────────────────
      const [envModal, setEnvModal] = useState(null); // { title, runs } | null

      useScrollEffects();

      return (
        <div className="dash">

          {/* ── Scroll progress bar (fixed, top of page) ── */}
          <div id="scroll-progress" />

          {/* ── Back to top button (fixed, bottom-right) ── */}
          <button id="back-to-top" onClick={function(){ window.scrollTo({top:0,behavior:'smooth'}); }}
            title="Back to top" aria-label="Back to top">
            &#8679;
          </button>

          {/* ── Env runs modal (portal-style, rendered at top of tree) ── */}
          {envModal && (
            <EnvRunsModal
              runs={envModal.runs}
              title={envModal.title}
              reportBaseUrl={reportBaseUrl}
              onClose={() => setEnvModal(null)}
            />
          )}

          {/* ── Header ── */}
          <header className="dash-header">
            <div className="dash-header-inner">
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.4rem'}}>
                  <span style={{fontSize:'0.65rem',fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',opacity:0.6}}>✦ AI Powered Analysis</span>
                </div>
                <div className="dash-title">SIMS Finance — AI Analysis</div>
                <div className="dash-subtitle">
                  Playwright Test Intelligence · {trend.runsAnalysed ?? 0} business-day runs
                  {(trend.weekendExcluded ?? 0) > 0 && (
                    <span style={{opacity:0.7}}> (+{trend.weekendExcluded} weekend auto-excluded)</span>
                  )}
                  · {trend.dateRange?.from ?? '?'} → {trend.dateRange?.to ?? '?'}
                </div>
                {/* ── Detected environments strip ── */}
                {(() => {
                  const envEntries = Object.entries(trend.byEnvironment || {});
                  if (envEntries.length === 0) return null;
                  return (
                    <div style={{display:'flex',gap:'0.35rem',flexWrap:'wrap',marginTop:'0.55rem'}}>
                      <span style={{fontSize:'0.65rem',fontWeight:600,opacity:0.7,alignSelf:'center'}}>Environments:</span>
                      {envEntries.map(([env, d], i) => (
                        <span key={i} style={{display:'inline-block',padding:'0.15rem 0.6rem',borderRadius:'999px',fontSize:'0.65rem',fontWeight:700,background:'rgba(255,255,255,0.22)',border:'1px solid rgba(255,255,255,0.35)',letterSpacing:'0.02em'}}>
                          {env} <span style={{opacity:0.75}}>({d.total} runs)</span>
                        </span>
                      ))}
                    </div>
                  );
                })()}
                <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap',marginTop:'0.75rem'}}>
                  {[
                    { label:'📊 Trend Analysis',       color:'rgba(255,255,255,0.18)' },
                    { label:'🔍 Failure Analysis',      color:'rgba(255,255,255,0.18)' },
                    { label:'📈 Reliability Insights',  color:'rgba(255,255,255,0.18)' },
                  ].map((b,i) => (
                    <span key={i} style={{display:'inline-block',padding:'0.2rem 0.65rem',borderRadius:'999px',fontSize:'0.68rem',fontWeight:600,background:b.color,border:'1px solid rgba(255,255,255,0.25)',letterSpacing:'0.01em',whiteSpace:'nowrap'}}>
                      {b.label}
                    </span>
                  ))}
                </div>
              </div>
              <div className="dash-header-right">
                {trendBadge(trendDir)}
                {window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? <AnalyseButton /> : null}
                <span className="dash-meta">Generated {generatedAt}</span>
              </div>
            </div>
          </header>

          {/* ── Sticky nav ── */}
          <nav className="dash-nav">
            <div className="dash-nav-inner">
              <a href="#s-overview">📊 Overview</a>
              <a href="#s-top-risks">⚠️ Top Risks</a>
              <a href="#s-trends">📈 Trends</a>
              <a href="#s-regression">🔁 Regression</a>
              <a href="#s-unstable">🔴 Unstable Tests</a>
              <a href="#s-db">🗄️ DB Integrity</a>
              {apiIntel && <a href="#s-api">🌐 API Intelligence</a>}
              <a href="#s-actions">✅ Action Items</a>
            </div>
          </nav>

          <main className="dash-main">

            {/* ══ 1. OVERVIEW ══ */}
            <div id="s-overview" className="dash-section">

              <p className="section-label">Overview</p>

              {/* KPI tiles */}
              <div className="kpi-row">

                {/* ── 1. Health Score + Trend Direction ── */}
                <div className="kpi-tile" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'0.5rem',borderTop:'3px solid ' + healthColor(score)}}>
                  <div style={{display:'flex',alignItems:'center',gap:'0.4rem'}}>
                    <div className="kpi-label" style={{margin:0}}>Health Score</div>
                    <i className="info-trigger"
                       data-tooltip="Composite 0–100 score (0 = critical, 100 = perfect) derived from four deterministic signals: clean run rate, average test pass rate, flaky test frequency, and whether the trend is improving or degrading. Computed by the Trend Analysis Agent from the consolidated run history — no AI inference involved. Thresholds: 75+ Healthy · 50–74 Warning · below 50 Critical. A single outlier run has limited impact; the score reflects sustained behaviour.">i</i>
                  </div>
                  <HealthRing score={score} />
                  <span style={{fontSize:'0.7rem',fontWeight:700,color:healthColor(score),letterSpacing:'0.05em',textTransform:'uppercase'}}>
                    {score>=75?'● Healthy':score>=50?'● Warning':'● Critical'}
                  </span>
                  <span style={{display:'inline-flex',alignItems:'center',gap:'0.3rem'}}>
                    <span style={{
                      fontSize:'0.72rem', fontWeight:700, letterSpacing:'0.04em',
                      color: trendDir==='Improving' ? '#059669' : trendDir==='Degrading' ? '#dc2626' : '#64748b'
                    }}>
                      {trendDir==='Improving' ? '↑ Improving' : trendDir==='Degrading' ? '↓ Degrading' : '→ Stable'}
                    </span>
                    <i className="info-trigger"
                       style={{background: trendDir==='Improving' ? '#d1fae5' : trendDir==='Degrading' ? '#fee2e2' : '#f1f5f9',
                               color:      trendDir==='Improving' ? '#065f46' : trendDir==='Degrading' ? '#991b1b' : '#475569'}}
                       data-tooltip="Direction of the health trend across recent business-day runs. Improving = clean run rate and pass rate are rising over the window. Degrading = both are declining or failure frequency is increasing. Stable = no statistically meaningful change detected. Determined by the Trend Analysis Agent by comparing the first half of the run window against the second half — not a single-run snapshot.">i</i>
                  </span>
                </div>

                {/* ── 2. Avg Test Pass Rate ── */}
                <div className="kpi-tile">
                  <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'0.5rem'}}>
                    <div className="kpi-label" style={{margin:0}}>Avg Test Pass Rate</div>
                    <i className="info-trigger"
                       data-tooltip="Average percentage of tests that pass per CI run. Calculated as mean(passed ÷ executed × 100) across all business-day runs. Gives partial credit for near-perfect runs — a run where 41/42 tests pass scores 97%, not 0%. Primary health signal.">i</i>
                  </div>
                  <div className="kpi-value" style={{color:healthColor(trend.avgTestPassRate??0)}}>{trend.avgTestPassRate??0}%</div>
                  <RateBar value={trend.avgTestPassRate??0} colorClass={(trend.avgTestPassRate??0)>=95?'bg-emerald-500':(trend.avgTestPassRate??0)>=80?'bg-amber-400':'bg-rose-500'} />
                  {(trend.weekendExcluded ?? 0) > 0 && (
                    <div className="kpi-sub" style={{marginTop:'0.4rem'}}>
                      <span style={{color:'#94a3b8'}}>{trend.weekendExcluded} wknd run{trend.weekendExcluded !== 1 ? 's' : ''} auto-excluded</span>
                    </div>
                  )}
                </div>

                {/* ── 3. Last Execution Age (per environment) ── */}
                {(() => {
                  const execRows = deriveLastExecAgeByEnv(trend.byEnvironment);
                  if (!execRows.length) return (
                    <div className="kpi-tile">
                      <div className="kpi-label">Last Execution Age</div>
                      <div className="kpi-value" style={{color:'#94a3b8'}}>—</div>
                      <div className="kpi-sub">no environment data</div>
                    </div>
                  );
                  const worst   = execRows.reduce((a, b) => (b.daysAgo ?? 0) > (a.daysAgo ?? 0) ? b : a);
                  const hdDays  = worst.daysAgo;
                  const hdColor = hdDays === null ? '#94a3b8' : hdDays <= 1 ? '#059669' : hdDays <= 3 ? '#d97706' : '#dc2626';
                  const hdLabel = hdDays === null ? '—' : hdDays === 0 ? 'Today' : hdDays === 1 ? '1 day ago' : (hdDays + ' days ago');
                  return (
                    <div className="kpi-tile">
                      <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'0.5rem'}}>
                        <div className="kpi-label" style={{margin:0}}>Last Execution Age</div>
                        <i className="info-trigger"
                           data-tooltip="Per-environment: how long ago the most recent CI run completed. Green 0–1d = running regularly. Amber 2–3d = slightly stale. Red 4+d = environment may be blocked or skipped. Headline shows the stalest environment.">i</i>
                      </div>
                      <div className="kpi-value" style={{color:hdColor,marginBottom:'0.6rem'}}>{hdLabel}</div>
                      <div style={{display:'flex',flexDirection:'column',gap:'0.35rem',borderTop:'1px solid #f1f5f9',paddingTop:'0.5rem'}}>
                        {execRows.map(({env, daysAgo, lastDate}) => {
                          const dotColor = daysAgo === null ? '#94a3b8' : daysAgo <= 1 ? '#059669' : daysAgo <= 3 ? '#d97706' : '#dc2626';
                          const ageLabel = daysAgo === null ? '—' : daysAgo === 0 ? 'Today' : daysAgo === 1 ? '1d ago' : (daysAgo + 'd ago');
                          return (
                            <div key={env} style={{display:'flex',alignItems:'center',gap:'0.4rem'}}>
                              <span style={{width:7,height:7,borderRadius:'50%',background:dotColor,flexShrink:0,display:'inline-block'}}></span>
                              <span style={{fontSize:'0.68rem',fontWeight:700,letterSpacing:'0.04em',color:'#475569',background:'#f1f5f9',padding:'0.1rem 0.45rem',borderRadius:'999px',flexShrink:0}}>{env}</span>
                              <span style={{flex:1,fontSize:'0.7rem',color:'#94a3b8',textAlign:'right'}}>{lastDate ?? '—'}</span>
                              <span style={{fontSize:'0.72rem',fontWeight:700,color:dotColor,minWidth:'4.5rem',textAlign:'right'}}>{ageLabel}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {/* ── 4. Unstable Tests — replaces run-level Flaky Rate ── */}
                {(() => {
                  const profiles = deep.perTestProfiles || [];
                  if (!profiles.length) return (
                    <div className="kpi-tile">
                      <div className="kpi-label">Unstable Tests</div>
                      <div className="kpi-value" style={{color:'#94a3b8'}}>—</div>
                      <div className="kpi-sub">no profile data</div>
                    </div>
                  );
                  const { total, failing, flaky, unstable, pct } = deriveTestStabilityStats(profiles);
                  const valColor = pct === 0 ? '#059669' : pct <= 33 ? '#d97706' : '#dc2626';
                  return (
                    <div className="kpi-tile">
                      <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'0.5rem'}}>
                        <div className="kpi-label" style={{margin:0}}>Unstable Tests</div>
                        <i className="info-trigger"
                           data-tooltip="Tests that have at least one failure or flaky result across the profiled runs. Calculated per-test — a single flaky test causing 10 runs to be flagged still counts as 1 unstable test. A test can be both failing and flaky.">i</i>
                      </div>
                      <div className="kpi-value" style={{color:valColor}}>
                        {unstable}
                        <span style={{fontSize:'1rem',color:'#94a3b8',fontWeight:500}}>/{total}</span>
                      </div>
                      <RateBar value={pct} colorClass={pct===0?'bg-emerald-500':pct<=33?'bg-amber-400':'bg-rose-500'} />
                      <div className="kpi-sub" style={{marginTop:'0.5rem',borderTop:'1px solid #f1f5f9',paddingTop:'0.4rem',display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
                        <span style={{padding:'0.1rem 0.5rem',borderRadius:'999px',fontSize:'0.68rem',fontWeight:700,background:'#fee2e2',color:'#b91c1c'}}>{failing} failing</span>
                        <span style={{padding:'0.1rem 0.5rem',borderRadius:'999px',fontSize:'0.68rem',fontWeight:700,background:'#fef3c7',color:'#92400e'}}>{flaky} flaky</span>
                      </div>
                    </div>
                  );
                })()}

                {/* ── 5. Last Failure Age (per environment) ── */}
                {(() => {
                  const envRows = deriveLastFailureAgeByEnv(trend.byEnvironment, deep.perTestProfiles);
                  if (!envRows.length) return (
                    <div className="kpi-tile">
                      <div className="kpi-label">Last Failure Age</div>
                      <div className="kpi-value" style={{color:'#94a3b8'}}>—</div>
                      <div className="kpi-sub">no environment data</div>
                    </div>
                  );
                  const active = envRows.filter(r => r.daysAgo !== null);
                  const worst  = active.length ? active.reduce((a,b) => b.daysAgo < a.daysAgo ? b : a) : null;
                  const hdDays = worst ? worst.daysAgo : null;
                  const hdColor = hdDays === null ? '#059669' : hdDays >= 14 ? '#059669' : hdDays >= 7 ? '#d97706' : '#dc2626';
                  const hdLabel = hdDays === null ? 'All clean' : hdDays === 0 ? 'Today' : hdDays === 1 ? '1 day ago' : (hdDays + ' days ago');
                  return (
                    <div className="kpi-tile">
                      <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'0.5rem'}}>
                        <div className="kpi-label" style={{margin:0}}>Last Failure Age</div>
                        <i className="info-trigger"
                           data-tooltip="Per-environment: days since the most recent CI run where at least one test failed. Green ≥14d = historical. Amber 7–13d = recent. Red 0–6d = active issue. Headline shows the worst environment.">i</i>
                      </div>
                      <div className="kpi-value" style={{color:hdColor,marginBottom:'0.6rem'}}>{hdLabel}</div>
                      <div style={{display:'flex',flexDirection:'column',gap:'0.35rem',borderTop:'1px solid #f1f5f9',paddingTop:'0.5rem'}}>
                        {envRows.map(({env, daysAgo, lastDate, topTest, topTestKind}) => {
                          const dotColor = daysAgo === null ? '#059669' : daysAgo >= 14 ? '#059669' : daysAgo >= 7 ? '#d97706' : '#dc2626';
                          const ageLabel = daysAgo === null ? 'Never' : daysAgo === 0 ? 'Today' : daysAgo === 1 ? '1d ago' : (daysAgo + 'd ago');
                          const truncated = topTest && topTest.length > 26 ? topTest.slice(0, 24) + '…' : topTest;
                          const kindColor = topTestKind === 'flaky' ? '#d97706' : '#dc2626';
                          return (
                            <div key={env} style={{display:'flex',flexDirection:'column',gap:'0.15rem'}}>
                              <div style={{display:'flex',alignItems:'center',gap:'0.4rem'}}>
                                <span style={{width:7,height:7,borderRadius:'50%',background:dotColor,flexShrink:0,display:'inline-block'}}></span>
                                <span style={{fontSize:'0.68rem',fontWeight:700,letterSpacing:'0.04em',color:'#475569',background:'#f1f5f9',padding:'0.1rem 0.45rem',borderRadius:'999px',flexShrink:0}}>{env}</span>
                                <span style={{flex:1,fontSize:'0.7rem',color:'#94a3b8',textAlign:'right'}}>{lastDate ?? '—'}</span>
                                <span style={{fontSize:'0.72rem',fontWeight:700,color:dotColor,minWidth:'4.5rem',textAlign:'right'}}>{ageLabel}</span>
                              </div>

                                  <span style={{fontSize:'0.6rem',fontWeight:700,color:kindColor,flexShrink:0}}>{topTestKind}</span>
                                  <span title={topTest} style={{fontSize:'0.67rem',fontStyle:'italic',color:'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{truncated}</span>
                                </div>
                              )}
                            </div>
                          );

  <script>
    /* ── Global Info Tooltip Engine ──────────────────────────────────────────
       Trigger: any element with class="info-trigger" and data-tooltip="..."
       One global <div id="global-tooltip"> is created at <body> level.
       Uses getBoundingClientRect() + position:fixed — immune to all
       overflow:hidden, transform, or stacking-context ancestors.        */
    (function () {
      var MAX_W   = 320;   /* wider — matches the CSS max-width; prevents mid-word wrapping */
      var MARGIN  = 12;   /* px clear of viewport edges — slightly more on narrow screens */
      var GAP     = 8;    /* px gap between trigger and tooltip box */
      var DELAY   = 150;   /* ms before showing */
      var tt      = document.createElement('div');
      tt.id = 'global-tooltip';
      document.body.appendChild(tt);

      var showTimer, hideTimer;

      function position(trigger) {
        var r   = trigger.getBoundingClientRect();
        var iCx = r.left + r.width / 2;
        var vw  = window.innerWidth;
        var vh  = window.innerHeight;

        /* Clamp width to avoid overflow near edges */
        var w = Math.min(MAX_W, vw - MARGIN * 2);
        tt.style.maxWidth = w + 'px';

        /* Measure tooltip height after content set */
        tt.style.left = '-9999px'; tt.style.top = '-9999px';
        var th = tt.offsetHeight;

        /* Prefer below; flip above if no room below */
        var below = (r.bottom + GAP + th) <= (vh - MARGIN);
        var topPx = below ? r.bottom + GAP : r.top - th - GAP;

        /* Clamp left */
        var leftPx = iCx - w / 2;
        leftPx = Math.max(MARGIN, Math.min(leftPx, vw - w - MARGIN));

        /* Arrow x relative to box */
        var ax = Math.max(10, Math.min(iCx - leftPx, w - 10));

        tt.style.setProperty('--ax', ax + 'px');
        tt.style.left = leftPx + 'px';
        tt.style.top  = topPx  + 'px';
        tt.className  = 'tt-visible ' + (below ? 'tt-below' : 'tt-above');
      }

      function show(trigger) {
        clearTimeout(hideTimer);
        tt.textContent = '';   /* clear first */
        tt.textContent = trigger.dataset.tooltip || '';
        position(trigger);
        requestAnimationFrame(function () { tt.classList.add('tt-show'); });
      }

      function hide() {
        tt.classList.remove('tt-show');
        hideTimer = setTimeout(function () { tt.className = ''; }, 200);
      }

      document.addEventListener('mouseover', function (e) {
        var trigger = e.target.closest('.info-trigger');
        if (!trigger || !trigger.dataset.tooltip) return;
        clearTimeout(hideTimer);
        clearTimeout(showTimer);
        showTimer = setTimeout(function () { show(trigger); }, DELAY);
      });

      document.addEventListener('mouseout', function (e) {
        var trigger = e.target.closest('.info-trigger');
        if (trigger && !trigger.contains(e.relatedTarget)) {
          clearTimeout(showTimer);
          hide();
        }
      });

      /* Reposition on scroll / resize without flicker */
      var lastTrigger = null;
      document.addEventListener('mouseover', function (e) {
        var t = e.target.closest('.info-trigger');
        lastTrigger = t || lastTrigger;
      });
      window.addEventListener('scroll', function () {
        if (tt.classList.contains('tt-show') && lastTrigger) position(lastTrigger);
      }, { passive:true });
      /* Reposition on resize — viewport width changes (e.g. DevTools dock) */
      window.addEventListener('resize', function () {
        if (tt.classList.contains('tt-show') && lastTrigger) position(lastTrigger);
      }, { passive:true });
    })();
  </script>
